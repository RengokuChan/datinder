<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DATinder – le Tinder des data centers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f9;--card:#ffffff;--ink:#161822;--mute:#687082;--line:rgba(22,24,34,.09);
  --panel:rgba(255,255,255,.92);--panel-solid:#ffffff;--chip:#eef0f6;
  --pink:#fd267a;--orange:#ff6036;--gold:#f0b93d;--green:#21d07a;--red:#ff4458;--blue:#2ab6ff;
  --grad:linear-gradient(135deg,#fd267a 0%,#ff6036 100%);
  --shadow:0 20px 50px rgba(16,19,30,.11);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#090a0f;--card:#141720;--ink:#f5f7fc;--mute:#9199a8;--line:rgba(255,255,255,.09);
    --panel:rgba(19,22,31,.88);--panel-solid:#161923;--chip:#1d212e;
    --shadow:0 24px 60px rgba(0,0,0,.6);color-scheme:dark
  }
}
:root[data-theme="dark"]{
  --bg:#090a0f;--card:#141720;--ink:#f5f7fc;--mute:#9199a8;--line:rgba(255,255,255,.09);
  --panel:rgba(19,22,31,.88);--panel-solid:#161923;--chip:#1d212e;
  --shadow:0 24px 60px rgba(0,0,0,.6);color-scheme:dark
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;position:relative;
  background-image:radial-gradient(rgba(130,140,160,.11) 1px,transparent 1px);
  background-size:24px 24px
}
body::before,body::after{
  content:"";position:fixed;border-radius:50%;filter:blur(120px);opacity:.22;z-index:0;pointer-events:none;
  animation:drift 16s ease-in-out infinite alternate
}
body::before{width:60vmax;height:60vmax;background:var(--pink);top:-25vmax;left:-18vmax}
body::after{width:60vmax;height:60vmax;background:var(--orange);bottom:-28vmax;right:-18vmax;animation-delay:-8s}
@keyframes drift{to{transform:translate(6vmax,5vmax) scale(1.12)}}

/* Forçage du format téléphone (max-width: 440px centré) pour garder les illustrations parfaites */
#app{
  height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;
  padding:10px 14px 14px;position:relative;z-index:1
}

header{display:flex;align-items:center;justify-content:center;position:relative;padding:2px 0 12px;min-height:46px;flex-shrink:0}
.logo{
  font-weight:800;font-size:31px;letter-spacing:-1.4px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  display:flex;align-items:center;gap:8px;user-select:none;
  filter:drop-shadow(0 4px 16px rgba(253,38,122,.26))
}
.logo svg{width:28px;height:28px;flex-shrink:0;animation:beat 1.8s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18) rotate(-5deg)}30%{transform:scale(1)}}

.top-r{position:absolute;right:2px;display:flex;align-items:center;gap:8px}
.cnt{
  font-size:12.5px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;
  background:var(--panel);backdrop-filter:blur(14px);
  border:1px solid var(--line);padding:5px 11px;border-radius:99px;
  display:inline-flex;align-items:center;gap:7px
}
.tbtn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel);backdrop-filter:blur(14px);
  color:var(--ink);font-size:14px;display:grid;place-items:center;cursor:pointer;
  transition:transform .2s cubic-bezier(.2,1.5,.4,1)
}
.tbtn:hover{transform:scale(1.1) rotate(12deg)}

#main{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;position:relative}

.card{
  position:relative;flex:1;min-height:0;border-radius:26px;overflow:hidden;
  box-shadow:0 28px 64px -14px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.18);
  touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  animation:pop .48s cubic-bezier(.2,1.3,.4,1) both;will-change:transform
}
.card:active{cursor:grabbing}
@keyframes pop{from{transform:translateY(24px) scale(.94);opacity:0}}
.card::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.22) 50%,transparent 62%);
  transform:translateX(-100%);animation:shine 5.5s ease-in-out infinite;z-index:2;pointer-events:none
}
@keyframes shine{35%,100%{transform:translateX(100%)}}
.card::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 28% 14%,rgba(255,255,255,.24),transparent 56%);pointer-events:none;z-index:1
}

.card .pic{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center 15%;
  z-index:0;pointer-events:none;user-select:none;-webkit-user-drag:none
}
.card.has-pic .emo{display:none}

.orb{position:absolute;border-radius:50%;background:rgba(255,255,255,.12);animation:float 6s ease-in-out infinite;pointer-events:none}
.orb.a{width:56%;aspect-ratio:1;top:-11%;right:-16%}
.orb.b{width:36%;aspect-ratio:1;top:30%;left:-11%;animation-delay:-3s}

.seg{position:absolute;top:12px;left:13px;right:13px;display:flex;gap:5px;z-index:3;pointer-events:none}
.seg i{flex:1;height:3.5px;border-radius:99px;background:rgba(255,255,255,.35);transition:background .3s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.seg i.past{background:rgba(255,255,255,.72)}
.seg i.on{background:#fff;box-shadow:0 0 10px rgba(255,255,255,.85)}

.emo{
  position:absolute;inset:0 0 38% 0;display:grid;place-items:center;
  font-size:clamp(90px,24vh,170px);filter:drop-shadow(0 16px 22px rgba(0,0,0,.35));
  animation:float 4s ease-in-out infinite;pointer-events:none
}
.emo::before{
  content:"";position:absolute;left:50%;top:50%;width:66%;aspect-ratio:1;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.46),transparent 70%);z-index:-1
}
@keyframes float{50%{transform:translateY(-12px) rotate(3deg)}}

.dist{
  position:absolute;top:25px;left:14px;z-index:3;
  background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.28);
  backdrop-filter:blur(10px);color:#fff;font-size:12px;font-weight:600;padding:4px 11px;border-radius:99px
}

.info{
  position:absolute;left:0;right:0;bottom:0;padding:60px 16px 16px;color:#fff;z-index:2;
  background:linear-gradient(transparent,rgba(8,10,15,.76) 28%,rgba(8,10,15,.96) 72%);pointer-events:none
}
.info h2{margin:0;font-size:clamp(24px,4.2vh,34px);font-weight:800;letter-spacing:-.6px;display:flex;align-items:center;gap:8px}
.info h2 span{font-weight:500;font-size:.68em;opacity:.9}
.vf{
  width:.62em;height:.62em;border-radius:50%;background:var(--blue);
  display:inline-grid;place-items:center;font-size:.48em;font-weight:800;
  box-shadow:0 2px 10px rgba(42,182,255,.65)
}
.loc{font-size:clamp(11.5px,1.7vh,14px);opacity:.88;margin:2px 0 7px;font-weight:500}
.info p{margin:0 0 9px;font-size:clamp(12px,1.9vh,14px);line-height:1.4;opacity:.94}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags b{
  font-weight:600;font-size:clamp(10.5px,1.5vh,12px);padding:4px 10px;
  border:1px solid rgba(255,255,255,.3);border-radius:99px;
  background:rgba(255,255,255,.14);backdrop-filter:blur(6px)
}

.st{
  position:absolute;top:52px;font-size:32px;font-weight:800;padding:3px 12px;
  border:4px solid;border-radius:12px;opacity:0;pointer-events:none;z-index:4;
  letter-spacing:1.2px;background:rgba(0,0,0,.25);backdrop-filter:blur(4px)
}
.st.like{left:16px;color:#3be8a0;border-color:#3be8a0;transform:rotate(-14deg)}
.st.nope{right:16px;color:#ff5c72;border-color:#ff5c72;transform:rotate(14deg)}
.st.sup{left:50%;top:40%;transform:translateX(-50%) rotate(-6deg);color:var(--blue);border-color:var(--blue);font-size:26px;white-space:nowrap}

.btns{display:flex;justify-content:center;align-items:center;gap:18px;padding:2px 0}
.btns button{
  width:64px;height:64px;border-radius:50%;border:2px solid;
  background:var(--panel-solid);box-shadow:0 12px 28px rgba(0,0,0,.24);
  display:grid;place-items:center;cursor:pointer;
  transition:transform .18s cubic-bezier(.2,1.5,.4,1),box-shadow .18s,background .18s,color .18s
}
.btns button svg{width:42%;height:42%}
.btns button:hover{transform:scale(1.12) translateY(-3px);box-shadow:0 16px 34px rgba(0,0,0,.34)}
.btns button:active{transform:scale(.9)}
.btns .sm{width:52px;height:52px}
#bn{color:var(--red);border-color:rgba(255,68,88,.35)}
#bs{color:var(--blue);border-color:rgba(42,182,255,.35)}
#bl{color:var(--green);border-color:rgba(33,208,122,.35)}
#bl:hover{background:var(--green);border-color:var(--green);color:#fff!important}
#bn:hover{background:var(--red);border-color:var(--red);color:#fff!important}
#bs:hover{background:var(--blue);border-color:var(--blue);color:#fff!important}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.panel{
  background:var(--panel);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid var(--line);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.14);
  flex:1;min-height:0;overflow:auto;border-radius:26px;padding:20px;animation:pop .4s both
}
.who{color:var(--mute);font-size:14px;margin-bottom:10px;line-height:1.45}

.go{
  border:0;border-radius:99px;padding:14px 22px;font-size:16px;font-weight:700;color:#fff;
  background:linear-gradient(90deg,var(--pink),var(--orange),var(--pink));
  background-size:200% 100%;animation:sheen 4s linear infinite;letter-spacing:.2px;
  cursor:pointer;width:100%;margin-top:10px;box-shadow:0 10px 26px rgba(253,38,122,.34);
  transition:transform .18s cubic-bezier(.2,1.5,.4,1),box-shadow .18s
}
@keyframes sheen{to{background-position:200% 0}}
.go:hover{transform:translateY(-2px) scale(1.015);box-shadow:0 14px 32px rgba(253,38,122,.46)}
.go:active{transform:scale(.97)}

.hero{text-align:center;display:flex;flex-direction:column;justify-content:center}
.hero .big{display:grid;place-items:center;margin:0 auto 14px;font-size:0}
.hero .big i{
  width:84px;height:84px;border-radius:50%;
  background:var(--grad);
  animation:ring 2.2s infinite;display:grid;place-items:center;
  font-style:normal;font-size:36px;color:#fff;box-shadow:0 10px 26px rgba(253,38,122,.38)
}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(253,38,122,.48)}70%,100%{box-shadow:0 0 0 34px rgba(253,38,122,0)}}
.hero h1{margin:6px 0;font-size:clamp(23px,4.2vh,32px);font-weight:800;line-height:1.14;letter-spacing:-.6px}

.fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.fx i{position:absolute;top:-24px;font-style:normal;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(106vh) rotate(540deg);opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="fx" id="fx"></div>
<div id="app">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="tflame" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#fd267a"/>
            <stop offset="100%" stop-color="#ff6036"/>
          </linearGradient>
        </defs>
        <path fill="url(#tflame)" d="M13.5 2.2c.4 3.4-1.4 5.6-3.4 7.1-.3-1.4-.2-2.9.3-4.1-3.3 1.7-5.9 5.1-5.9 9.1 0 4.3 3.4 7.7 7.6 7.7s7.4-3.4 7.4-7.6c0-4.9-3.1-9.6-6-12.2z"/>
      </svg>
      datinder
    </div>
    <div class="top-r">
      <div class="cnt" id="cnt">1 / 5</div>
      <button class="tbtn" id="th" title="Changer le thème" aria-label="Changer le thème">🌓</button>
    </div>
  </header>
  <div id="main"></div>
</div>

<script>
const P = [
  {img:"img/natik.png", e:"🧜‍♀️", n:"Natick", a:"35 m", loc:"📍 À 35 m sous la mer, au large de l’Écosse", g:["#0b5fd6","#12c2e9"], bio:"Petite mais profonde : 12 baies, 864 serveurs. C’est pas la taille qui compte, c’est ce qu’il y a dedans. Toujours bien humide… mais si c’est trop humide, ça marche moins bien. Pour une fois. 😏", t:["🌊 Plongée","🤫 Discrète","💦 Humide"], m:"Viens, on plonge ensemble. 🌊"},
  {img:"img/nordique.png", e:"🧊", n:"La Nordique", a:"Arctique", loc:"📍 À Hamina, Finlande, au bord de la Baltique", g:["#3b4cca","#8fd3f4"], bio:"Froide au premier abord, mais elle adore qu’on lui souffle dessus et qu’on l’arrose d’eau de mer. Ex-usine de papier, elle sait rester propre : jamais de contact direct sans échangeur. Il faut savoir se protéger. 😉", t:["❄️ Free cooling","🌿 Énergie verte","📜 Ex-usine de papier"], m:"J’ai les pieds froids, mais le cœur au chaud. ❄️"},
  {img:"img/forteresse.png", e:"🛡️", n:"La Forteresse", a:"18 ans", loc:"📍 À 30 m sous le granit de Stockholm", g:["#232526","#5b6770"], bio:"Difficile à avoir : badge, sas, portes de 40 cm. Elle demande tes empreintes avant le premier rendez-vous. Mais une fois dedans, elle tient la distance : deux moteurs de sous-marin en secours. 😎", t:["☢️ Ex-abri antiatomique","🔐 Biométrie","🕶️ Style James Bond"], m:"Pas besoin de frapper. Mais prépare ton badge. 🔐"},
  {img:"img/reveuse.jpg", e:"🚀", n:"La Rêveuse", a:"800 km", loc:"📍 À 800 km de toi, en orbite", g:["#1a0b3b","#7b2ff7"], bio:"Les yeux dans les étoiles, la tête à 800 km. Je t’ai envoyé un haïku depuis l’orbite. Petit défaut : je tiens 15 minutes, puis j’ai besoin d’une pause pour me refroidir. Tu reconnais quelqu’un ? 😅", t:["🛰️ En orbite","☀️ Solaire illimité","⏱️ 15 min chrono"], m:"J’appelle depuis l’orbite. Ne coupe pas. 🛰️"},
  {img:"img/genereuse.png", e:"🏅", n:"La Généreuse", a:"Médaillée", loc:"📍 Près de Paris, à deux pas de chez toi", g:["#f12711","#f5af19"], bio:"Médaillée olympique 🏅 j’ai chauffé la piscine des JO 2024. Chaude toute l’année, je ne garde rien pour moi. Je cherche quelqu’un qui sait se jeter à l’eau. 💦", t:["🔥 Toujours chaude","🏊 Chauffe les piscines","🏠 1 000 logements"], m:"Chez moi, on partage tout. Même la chaleur. 🔥"}
];

const SVG = {
  flame:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2.2c.4 3.4-1.4 5.6-3.4 7.1-.3-1.4-.2-2.9.3-4.1-3.3 1.7-5.9 5.1-5.9 9.1 0 4.3 3.4 7.7 7.6 7.7s7.4-3.4 7.4-7.6c0-4.9-3.1-9.6-6-12.2z"/></svg>`,
  nope:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  star:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.4l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.3l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"/></svg>`,
  like:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.2l-1.4-1.3C5.4 15.2 2 12.1 2 8.3 2 5.2 4.4 2.8 7.5 2.8c1.7 0 3.4.8 4.5 2.1 1.1-1.3 2.8-2.1 4.5-2.1 3.1 0 5.5 2.4 5.5 5.5 0 3.8-3.4 6.9-8.6 11.6L12 21.2z"/></svg>`
};

const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ne = s => String(s).replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu,"").replace(/\s+([.,!?])/g, "$1").replace(/\s+/g, " ").trim();

let idx = 0, phase = "intro", dragging = false;

function initApp() {
  const thBtn = $("#th");
  if (thBtn) {
    thBtn.onclick = () => {
      const cur = document.documentElement.getAttribute("data-theme");
      document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
    };
  }
  render();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initApp);
} else {
  initApp();
}

function burst(list = ["💘", "🔥", "✨", "💖", "🏆"]) {
  const fx = $("#fx"); if (!fx) return;
  for (let i = 0; i < 24; i++) {
    const el = document.createElement("i");
    el.textContent = list[i % list.length];
    el.style.left = (Math.random() * 94 + 3) + "vw";
    el.style.fontSize = (18 + Math.random() * 14) + "px";
    el.style.animationDuration = (1.5 + Math.random() * 1.3) + "s";
    el.style.animationDelay = (Math.random() * .2) + "s";
    fx.appendChild(el);
    setTimeout(() => el.remove(), 3100);
  }
}

function cardHTML(p, live, currentIdx = idx) {
  const segs = P.map((_, j) => `<i class="${j === currentIdx ? "on" : j < currentIdx ? "past" : ""}"></i>`).join("");
  const pic = p.img ? `<img class="pic" src="${esc(p.img)}" alt="${esc(p.n)}" onload="this.parentElement.classList.add('has-pic')" onerror="this.remove()">` : "";
  return `<div class="card" style="background:linear-gradient(155deg,${p.g[0]},${p.g[1]})">
    <div class="orb a"></div><div class="orb b"></div>
    ${pic}
    <div class="seg">${segs}</div>
    <div class="dist">${ne(p.loc.split(",")[0])}</div>
    <div class="emo">${p.e}</div>
    ${live ? `<div class="st like">LIKE</div><div class="st nope">NOPE</div><div class="st sup">SUPER LIKE</div>` : ""}
    <div class="info">
      <h2>${p.n}<span>${p.a}</span><b class="vf">✓</b></h2>
      <div class="loc">${ne(p.loc)}</div>
      <p>${ne(p.bio)}</p>
      <div class="tags">${p.t.map(x => `<b>${ne(x)}</b>`).join("")}</div>
    </div>
  </div>`;
}

function set(h) { const m = $("#main"); if (m) m.innerHTML = h; }

function render() {
  const c = $("#cnt");
  if (phase === "intro") {
    if (c) c.textContent = "Intro";
    set(`<div class="panel hero">
      <div class="big"><i>${SVG.flame}</i></div>
      <h1>DATinder – Mode Amphi / Tableau</h1>
      <div class="who">Votez en direct à main levée ou assis/debout !<br><br><b>Gauche</b> = Nope<br><b>Haut</b> = Super Like<br><b>Droite</b> = Like</div>
      <button class="go" id="start-btn">C'est parti !</button>
    </div>`);
    const btn = $("#start-btn");
    if (btn) btn.onclick = () => { phase = "swipe"; idx = 0; render(); };
  } 
  else if (phase === "swipe") {
    if (c) c.textContent = (idx + 1) + " / " + P.length;
    set(cardHTML(P[idx], true) + `<div class="btns">
      <button aria-label="Passer" id="bn" title="Nope">${SVG.nope}</button>
      <button class="sm" aria-label="Super like" id="bs" title="Super Like">${SVG.star}</button>
      <button aria-label="Liker" id="bl" title="Like">${SVG.like}</button>
    </div>`);
    
    const bn = $("#bn"), bl = $("#bl"), bs = $("#bs");
    if (bn) bn.onclick = () => nextCard("nope");
    if (bl) bl.onclick = () => nextCard("like");
    if (bs) bs.onclick = () => nextCard("super");
    bindSwipe();
  }
  else if (phase === "end") {
    if (c) c.textContent = "Fin";
    set(`<div class="panel hero">
      <div class="big"><i>🏆</i></div>
      <h1>Session terminée !</h1>
      <div class="who">Tous les profils ont été explorés avec brio.</div>
      <button class="go" id="restart-btn">Recommencer</button>
    </div>`);
    const btn = $("#restart-btn");
    if (btn) btn.onclick = () => { phase = "intro"; idx = 0; render(); };
  }
}

function nextCard(k) {
  if (k === "super") burst(["⭐", "💙", "✨"]);
  const c = $(".card");
  const x = k === "nope" ? -1 : 1;
  if (c) {
    c.style.animation = "none";
    c.style.transition = "transform .42s cubic-bezier(.22,1,.36,1),opacity .38s";
    c.style.transform = k === "super" ? "translate3d(0,-125%,0) scale(.9)" : `translate3d(${x * 135}%,20px,0) rotate(${x * 25}deg)`;
    c.style.opacity = 0;
  }
  setTimeout(() => {
    idx++;
    if (idx >= P.length) {
      phase = "end";
      burst(["🏆", "💘", "🔥", "🎉", "✨"]);
    }
    render();
  }, 380);
}

function bindSwipe() {
  const c = $(".card"); if (!c) return;
  let x0 = null, y0 = 0, pid = null;
  const baseShadow = "0 28px 64px -14px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.18)";

  c.onpointerdown = e => {
    x0 = e.clientX; y0 = e.clientY; pid = e.pointerId; dragging = true;
    try { c.setPointerCapture(pid) } catch (_) { }
    c.style.transition = "none"; c.style.animation = "none";
  };

  c.onpointermove = e => {
    if (x0 === null || e.pointerId !== pid) return;
    const d = e.clientX - x0, u = y0 - e.clientY;
    c.style.transform = `translate3d(${d}px,${-Math.max(0, u) / 3}px,0) rotate(${d / 17}deg)`;
    const l = Math.min(1, Math.max(0, d / 105)), n = Math.min(1, Math.max(0, -d / 105)), s = Math.abs(d) < 70 ? Math.min(1, Math.max(0, u / 120)) : 0;
    const slike = $(".st.like"), snope = $(".st.nope"), ssup = $(".st.sup");
    if (slike) slike.style.opacity = l;
    if (snope) snope.style.opacity = n;
    if (ssup) ssup.style.opacity = s;
    if (s > .35) c.style.boxShadow = `0 24px 60px rgba(42,182,255,.55),inset 0 0 0 3px var(--blue)`;
    else if (l > .2) c.style.boxShadow = `0 24px 60px rgba(33,208,122,.5),inset 0 0 0 3px var(--green)`;
    else if (n > .2) c.style.boxShadow = `0 24px 60px rgba(255,68,88,.5),inset 0 0 0 3px var(--red)`;
    else c.style.boxShadow = baseShadow;
  };

  const end = e => {
    if (x0 === null || (e && e.pointerId !== undefined && e.pointerId !== pid)) return;
    const d = (e ? e.clientX : x0) - x0, u = y0 - (e ? e.clientY : y0);
    try { if (pid !== null) c.releasePointerCapture(pid) } catch (_) { }
    x0 = null; pid = null; dragging = false;
    if (u > 105 && Math.abs(d) < 80) nextCard("super");
    else if (d > 95) nextCard("like");
    else if (d < -95) nextCard("nope");
    else {
      c.style.transition = "transform .28s cubic-bezier(.2,1.5,.4,1),box-shadow .2s";
      c.style.transform = ""; c.style.boxShadow = baseShadow;
      document.querySelectorAll(".st").forEach(s => s.style.opacity = 0);
    }
  };
  c.onpointerup = end;
  c.onpointercancel = end;
}
</script>
