<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DATinder – le Tinder des data centers</title>
  <style>
    :root {
      --bg: #fff;
      --card: #fff;
      --ink: #21262e;
      --mute: #8a919c;
      --line: #e8e8ec;
      --panel: #f4f4f7;
      --pink: #fd267a;
      --orange: #ff6036;
      --green: #21d07a;
      --red: #ff4458;
      --blue: #2ab6ff;
      --shadow: 0 6px 22px rgba(0, 0, 0, .2);
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111418;
        --card: #1b2027;
        --ink: #f1f3f5;
        --mute: #9aa3ad;
        --line: #2a313a;
        --panel: #1b2027;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #111418;
      --card: #1b2027;
      --ink: #f1f3f5;
      --mute: #9aa3ad;
      --line: #2a313a;
      --panel: #1b2027;
      color-scheme: dark;
    }

    html {
      height: 100%;
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #app {
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 6px 12px 12px;
      box-sizing: border-box;
    }

    #app.wide {
      max-width: 1250px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 4px 0 10px;
    }

    .logo {
      font-weight: 800;
      font-size: 28px;
      letter-spacing: -1px;
      background: linear-gradient(90deg, var(--pink), var(--orange));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .cnt {
      position: absolute;
      right: 2px;
      font-size: 13px;
      color: var(--mute);
      font-weight: 600;
    }

    #main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      position: relative;
      flex: 1;
      min-height: 0;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
      touch-action: pan-y;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }

    .seg {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      gap: 4px;
      z-index: 2;
    }

    .seg i {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: rgba(255, 255, 255, .4);
    }

    .seg i:first-child {
      background: #fff;
    }

    .emo {
      position: absolute;
      inset: 0 0 40% 0;
      display: grid;
      place-items: center;
      font-size: clamp(90px, 24vh, 190px);
    }

    .info {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 50px 16px 14px;
      color: #fff;
      background: linear-gradient(transparent, rgba(0, 0, 0, .92) 45%);
    }

    .info h2 {
      margin: 0;
      font-size: clamp(26px, 4.4vh, 36px);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .info h2 span {
      font-weight: 400;
      font-size: .75em;
    }

    .vf {
      width: .62em;
      height: .62em;
      border-radius: 50%;
      background: var(--blue);
      display: inline-grid;
      place-items: center;
      font-size: .5em;
      font-weight: 700;
    }

    .loc {
      font-size: clamp(12px, 1.9vh, 15px);
      opacity: .9;
      margin: 2px 0 8px;
    }

    .info p {
      margin: 0 0 10px;
      font-size: clamp(14px, 2.2vh, 17px);
      line-height: 1.4;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tags b {
      font-weight: 500;
      font-size: clamp(11px, 1.8vh, 14px);
      padding: 4px 10px;
      border: 1.5px solid rgba(255, 255, 255, .7);
      border-radius: 99px;
    }

    .st {
      position: absolute;
      top: 30px;
      font-size: 34px;
      font-weight: 900;
      padding: 2px 12px;
      border: 4px solid;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      z-index: 3;
    }

    .st.like {
      left: 18px;
      color: #3be8a0;
      border-color: #3be8a0;
      transform: rotate(-14deg);
    }

    .st.nope {
      right: 18px;
      color: #ff5c72;
      border-color: #ff5c72;
      transform: rotate(14deg);
    }

    .st.sup {
      left: 50%;
      top: 40%;
      margin-left: -70px;
      color: var(--blue);
      border-color: var(--blue);
      font-size: 30px;
    }

    .btns {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 2px 0;
    }

    .btns button {
      width: clamp(58px, 9.5vh, 72px);
      height: clamp(58px, 9.5vh, 72px);
      border-radius: 50%;
      border: 2.5px solid;
      background: var(--card);
      box-shadow: var(--shadow);
      font-size: clamp(24px, 4vh, 32px);
      font-weight: 700;
      cursor: pointer;
    }

    .btns .sm {
      width: clamp(46px, 7.2vh, 56px);
      height: clamp(46px, 7.2vh, 56px);
      font-size: clamp(20px, 3.2vh, 26px);
    }

    button:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 2px;
    }

    .panel {
      flex: 1;
      min-height: 0;
      overflow: auto;
      background: var(--panel);
      border-radius: 14px;
      padding: 16px;
    }

    .panel h3 {
      margin: 0 0 4px;
      font-size: clamp(18px, 3vh, 24px);
    }

    .who {
      color: var(--mute);
      font-size: 14px;
      margin-bottom: 10px;
    }

    .go {
      border: 0;
      border-radius: 99px;
      padding: 14px;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(90deg, var(--pink), var(--orange));
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    .go.g2 {
      background: var(--mute);
    }

    .hero {
      text-align: center;
    }

    .hero .big {
      font-size: clamp(54px, 12vh, 96px);
    }

    .hero h1 {
      margin: 6px 0;
      font-size: clamp(26px, 5vh, 38px);
      line-height: 1.1;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 12px 0;
    }

    .tile {
      border: 0;
      border-radius: 14px;
      padding: 14px 6px;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .tile span {
      display: block;
      font-size: 38px;
    }

    .match {
      text-align: center;
      color: #fff;
      border-radius: 14px;
      padding: 22px 14px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--pink), var(--orange));
    }

    .match h1 {
      margin: 0 0 6px;
      font-size: clamp(34px, 7vh, 52px);
      font-style: italic;
    }

    .av {
      display: flex;
      justify-content: center;
      margin: 12px 0;
    }

    .av span {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #fff;
      display: grid;
      place-items: center;
      font-size: 44px;
      border: 4px solid #fff;
      box-shadow: var(--shadow);
    }

    .av span+span {
      margin-left: -14px;
    }

    .bub {
      display: inline-block;
      background: #fff;
      color: #21262e;
      border-radius: 18px;
      padding: 10px 14px;
      font-size: clamp(14px, 2.2vh, 17px);
      max-width: 90%;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      background: var(--card);
      color: var(--ink);
      font-size: 17px;
      margin: 8px 0;
      text-align: center;
    }

    .board {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 20px;
    }

    .board>.card {
      flex: 0 0 min(36vw, 400px);
      cursor: default;
    }

    .side {
      flex: 1;
      min-width: 0;
      overflow: auto;
      background: var(--panel);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .side h2 {
      margin: 0;
      font-size: clamp(22px, 4.2vh, 40px);
    }

    .qr {
      width: min(46vh, 100%);
      background: #fff;
      border-radius: 12px;
      padding: 6px;
      align-self: center;
      box-sizing: border-box;
    }

    .qr.s {
      width: min(20vh, 160px);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chips b {
      background: var(--card);
      border-radius: 99px;
      padding: 6px 12px;
      font-size: clamp(14px, 2.4vh, 20px);
      font-weight: 600;
    }

    .bar {
      height: 16px;
      border-radius: 8px;
      background: var(--line);
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      transition: width .5s;
    }

    .row {
      display: flex;
      justify-content: space-between;
      font-size: clamp(16px, 3vh, 26px);
      font-weight: 700;
      margin-top: 6px;
    }

    .nm {
      font-size: clamp(13px, 2.3vh, 19px);
      color: var(--mute);
    }

    .ctl {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }

    .ctl .go {
      margin: 0;
    }

    .note {
      font-size: 12px;
      color: var(--mute);
    }

    @media (max-width: 800px) {
      .board {
        flex-direction: column;
      }

      .board>.card {
        flex: 0 0 40vh;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .card,
      .bar i {
        transition: none !important;
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>

<body>
  <div id="app">
    <header>
      <div class="logo">🔥 datinder</div>
      <div class="cnt" id="cnt"></div>
    </header>
    <div id="main"></div>
  </div>

  <script>
    const JOIN = "https://claude.ai/artifact/L1HrZuZ31p7TkJcpiQaYXG";

    const P = [
      {
        e: "🧜‍♀️",
        n: "Natick",
        a: "35 m",
        loc: "📍 À 35 m sous la mer, au large de l’Écosse",
        g: ["#0b5fd6", "#12c2e9"],
        bio: "Petite mais profonde : 12 baies, 864 serveurs. C’est pas la taille qui compte, c’est ce qu’il y a dedans. Toujours bien humide… mais si c’est trop humide, ça marche moins bien. Pour une fois. 😏",
        t: ["🌊 Plongée", "🤫 Discrète", "💦 Humide"],
        m: "Viens, on plonge ensemble. 🌊"
      },
      {
        e: "🧊",
        n: "La Nordique",
        a: "15 ans",
        loc: "📍 À Hamina, Finlande, au bord de la Baltique",
        g: ["#3b4cca", "#8fd3f4"],
        bio: "Froide au premier abord, mais elle adore qu’on lui souffle dessus et qu’on l’arrose d’eau de mer. Ex-usine de papier, elle sait rester propre : jamais de contact direct sans échangeur. Il faut savoir se protéger. 😉",
        t: ["❄️ Free cooling", "🌿 Énergie verte", "📜 Ex-usine de papier"],
        m: "J’ai les pieds froids, mais le cœur au chaud. ❄️"
      },
      {
        e: "🛡️",
        n: "La Forteresse",
        a: "18 ans",
        loc: "📍 À 30 m sous le granit de Stockholm",
        g: ["#232526", "#5b6770"],
        bio: "Difficile à avoir : badge, sas, portes de 40 cm. Elle demande tes empreintes avant le premier rendez-vous. Mais une fois dedans, elle tient la distance : deux moteurs de sous-marin en secours. 😎",
        t: ["☢️ Ex-abri antiatomique", "🔐 Biométrie", "🕶️ Style James Bond"],
        m: "Pas besoin de frapper. Mais prépare ton badge. 🔐"
      },
      {
        e: "🏅",
        n: "La Généreuse",
        a: "Médaillée",
        loc: "📍 Près de Paris, à deux pas de chez toi",
        g: ["#f12711", "#f5af19"],
        bio: "Médaillée olympique 🏅 j’ai chauffé la piscine des JO 2024. Chaude toute l’année, je ne garde rien pour moi. Je cherche quelqu’un qui sait se jeter à l’eau. 💦",
        t: ["🔥 Toujours chaude", "🏊 Chauffe les piscines", "🏠 1 000 logements"],
        m: "Chez moi, on partage tout. Même la chaleur. 🔥"
      },
      {
        e: "🚀",
        n: "La Rêveuse",
        a: "800 km",
        loc: "📍 À 800 km de toi, en orbite",
        g: ["#1a0b3b", "#7b2ff7"],
        bio: "Les yeux dans les étoiles, la tête à 800 km. Je t’ai envoyé un haïku depuis l’orbite. Petit défaut : je tiens 15 minutes, puis j’ai besoin d’une pause pour me refroidir. Tu reconnais quelqu’un ? 😅",
        t: ["🛰️ En orbite", "☀️ Solaire illimité", "⏱️ 15 min chrono"],
        m: "Je t’appelle depuis l’orbite. Ne coupe pas. 🛰️"
      },
      {
        e: "🏢",
        n: "La Fiable",
        a: "Ashburn",
        loc: "📍 En Virginie (USA), zone industrielle",
        g: ["#485563", "#29323c"],
        bio: "Pas la plus glamour : façade grise, zéro fenêtre. Mais je suis dispo à 99,999 %, même à 3 h du matin, et j’ai des centaines de connexions. On dit que 70 % du trafic mondial passe chez moi. Comme sur Tinder : vérifie avant d’y croire. 😉",
        t: ["🏢 Zone industrielle", "⏱️ Dispo 24h/24", "🌐 Gros réseau"],
        m: "Je suis dispo à 99,999 % pour toi. ⏱️"
      }
    ];

    const $ = s => document.querySelector(s);

    const esc = t => String(t).replace(/[&<>"']/g, c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c]));

    const sid = () => Math.random().toString(36).slice(2, 8);

    let DB = null,
      UID = null,
      PS = "",
      SES = { mode: "lobby", i: 0, sid: "0" },
      PL = [],
      S = [],
      M = [],
      uns = [],
      ph = "intro",
      sw = {},
      mk = null,
      pres = false,
      lastSid = null;

    function qr() {
      try {
        const q = qrcode(0, "M");
        q.addData(JOIN);
        q.make();
        const n = q.getModuleCount();
        let d = "";
        for (let r = 0; r < n; r++)
          for (let c = 0; c < n; c++)
            if (q.isDark(r, c)) d += `M${c + 4} ${r + 4}h1v1h-1z`;
        return `<svg viewBox="0 0 ${n + 8} ${n + 8}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QR code pour rejoindre"><path d="${d}" fill="#000"/></svg>`;
      } catch (e) {
        return `<div class="note">${esc(JOIN)}</div>`;
      }
    }

    function cardHTML(p, live) {
      return `<div class="card" style="background:linear-gradient(160deg,${p.g[0]},${p.g[1]})">
        <div class="seg"><i></i><i></i><i></i></div>
        <div class="emo">${p.e}</div>
        ${live ? `<div class="st like">LIKE</div><div class="st nope">NOPE</div><div class="st sup">SUPER LIKE</div>` : ""}
        <div class="info">
          <h2>${p.n}<span>${p.a}</span><b class="vf">✓</b></h2>
          <div class="loc">${p.loc}</div>
          <p>${p.bio}</p>
          <div class="tags">${p.t.map(x => `<b>${x}</b>`).join("")}</div>
        </div>
      </div>`;
    }

    const mine = a => a.filter(x => x.sid === SES.sid);

    function tally() {
      const s = mine(S),
        k = SES.i,
        g = t => s.filter(x => x.v[k] === t);
      return {
        like: g("like"),
        sup: g("super"),
        nope: g("nope"),
        n: s.filter(x => x.v[k]).length
      };
    }

    function setSes(p) {
      SES = { ...SES, ...p };
      if (DB) DB.doc("state/session").set(SES).catch(() => { });
      render();
    }

    function auto() {
      if (!pres || !DB || SES.mode !== "vote") return;
      const n = mine(PL).length;
      if (n > 0 && tally().n >= n) setSes({ mode: "stats" });
    }

    function names(a) {
      return a.map(x => esc(x.p)).join(", ") || "—";
    }

    function render() {
      pres ? board() : phone();
      $("#cnt").textContent = !pres && ph === "play" && SES.mode === "vote"
        ? (SES.i + 1) + " / " + P.length
        : "";
    }

    /* ---------- téléphone ---------- */
    function phone() {
      const m = $("#main");

      if (ph === "intro") {
        m.innerHTML = `<div class="panel hero">
          <div class="big">🔥💘🖥️</div>
          <h1>Trouve la data center de ta vie</h1>
          <div class="who">Choisis un pseudo pour rejoindre la séance.</div>
          <input id="pz" maxlength="20" placeholder="Ton pseudo" autocomplete="off" aria-label="Ton pseudo">
          <button class="go" id="start">Rejoindre</button>
        </div>`;
        $("#start").onclick = join;
        return;
      }

      const md = SES.mode;

      if (md === "lobby") {
        m.innerHTML = `<div class="panel hero">
          <div class="big">🎉</div>
          <h1>Tu es dans la salle, ${esc(PS)}</h1>
          <div class="who">La séance va commencer. Garde ton téléphone en main.</div>
        </div>`;
      }
      else if (md === "vote") {
        const p = P[SES.i];
        if (sw[SES.i]) {
          m.innerHTML = `<div class="panel hero">
            <div class="big">✅</div>
            <h1>Vote enregistré</h1>
            <div class="who">Regarde le tableau : on attend les autres.</div>
          </div>`;
        } else {
          m.innerHTML = cardHTML(p, true) + `<div class="btns">
            <button aria-label="Passer" id="bn" style="color:var(--red);border-color:var(--red)">✕</button>
            <button class="sm" aria-label="Super like" id="bs" style="color:var(--blue);border-color:var(--blue)">★</button>
            <button aria-label="Liker" id="bl" style="color:var(--green);border-color:var(--green)">♥</button>
          </div>`;
          $("#bn").onclick = () => vote("nope");
          $("#bl").onclick = () => vote("like");
          $("#bs").onclick = () => vote("super");
          bind();
        }
      }
      else if (md === "stats") {
        m.innerHTML = `<div class="panel hero">
          <div class="big">👀</div>
          <h1>Regarde le tableau</h1>
          <div class="who">Les résultats de ${P[SES.i].n} s’affichent.</div>
        </div>`;
      }
      else if (md === "match") {
        if (mk === null) {
          m.innerHTML = `<div class="panel hero">
            <h1>Ton match parfait ?</h1>
            <div class="who">Choisis-en une seule.</div>
            <div class="grid">${P.map((p, k) => `<button class="tile" data-k="${k}" style="background:linear-gradient(160deg,${p.g[0]},${p.g[1]})"><span>${p.e}</span>${p.n}</button>`).join("")}</div>
          </div>`;
          document.querySelectorAll(".tile").forEach(b => b.onclick = () => {
            mk = +b.dataset.k;
            if (DB && UID) DB.doc("matches/" + UID).set({ sid: SES.sid, k: mk, p: PS }).catch(() => { });
            render();
          });
        } else {
          const p = P[mk];
          m.innerHTML = `<div class="panel">
            <div class="match">
              <h1>It’s a match !</h1>
              <div>Toi et ${p.n} vous plaisez mutuellement</div>
              <div class="av"><span>🙂</span><span>${p.e}</span></div>
              <div class="bub">${p.m}</div>
            </div>
            <div class="who">Regarde le tableau pour la suite.</div>
          </div>`;
        }
      }
      else {
        m.innerHTML = `<div class="panel hero">
          <div class="big">🙏</div>
          <h1>Merci d’avoir joué !</h1>
        </div>`;
      }
    }

    function bind() {
      const c = $(".card");
      let x0 = null,
        y0 = 0;

      c.onpointerdown = e => {
        x0 = e.clientX;
        y0 = e.clientY;
        c.setPointerCapture(e.pointerId);
        c.style.transition = "none";
      };

      c.onpointermove = e => {
        if (x0 === null) return;
        const d = e.clientX - x0,
          u = y0 - e.clientY;
        c.style.transform = `translate(${d}px,${-Math.max(0, u) / 3}px) rotate(${d / 18}deg)`;
        $(".st.like").style.opacity = Math.max(0, d / 120);
        $(".st.nope").style.opacity = Math.max(0, -d / 120);
        $(".st.sup").style.opacity = Math.abs(d) < 60 ? Math.max(0, u / 140) : 0;
      };

      c.onpointerup = e => {
        if (x0 === null) return;
        const d = e.clientX - x0,
          u = y0 - e.clientY;
        x0 = null;
        if (u > 120 && Math.abs(d) < 80) vote("super");
        else if (d > 110) vote("like");
        else if (d < -110) vote("nope");
        else {
          c.style.transition = "transform .2s";
          c.style.transform = "";
          document.querySelectorAll(".st").forEach(s => s.style.opacity = 0);
        }
      };
    }

    function vote(k) {
      if (SES.mode !== "vote" || sw[SES.i]) return;
      const c = $(".card"),
        i = SES.i,
        x = k === "nope" ? -1 : 1;
      sw[i] = k;

      if (c) {
        c.style.transition = "transform .4s ease,opacity .4s";
        c.style.transform = k === "super"
          ? "translateY(-120%) scale(.9)"
          : `translateX(${x * 130}%) rotate(${x * 25}deg)`;
        c.style.opacity = 0;
      }

      if (DB && UID) {
        DB.doc("swipes/" + UID)
          .set({ sid: SES.sid, v: P.map((_, j) => sw[j] || null), p: PS })
          .catch(() => { });
      }

      setTimeout(() => {
        if (!DB) {
          if (i < P.length - 1) SES = { ...SES, i: i + 1 };
          else SES = { ...SES, mode: "match" };
        }
        render();
      }, 380);
    }

    function reg() {
      if (DB && UID && PS && lastSid !== SES.sid) {
        lastSid = SES.sid;
        DB.doc("players/" + UID).set({ sid: SES.sid, p: PS }).catch(() => { });
      }
    }

    function join() {
      const z = $("#pz");
      PS = ((z && z.value) || "").trim().slice(0, 20) || "Anonyme";
      ph = "play";
      if (!DB) SES = { mode: "vote", i: 0, sid: "L" };
      reg();
      render();
    }

    /* ---------- tableau (présentateur) ---------- */
    function board() {
      const m = $("#main"),
        md = SES.mode,
        p = P[SES.i],
        pl = mine(PL),
        t = tally(),
        n = pl.length;

      if (!DB) {
        m.innerHTML = `<div class="panel hero">
          <h1>Connexion impossible</h1>
          <div class="who">Ouvre cette page connectée à ton compte Claude pour piloter la séance.</div>
        </div>`;
        return;
      }

      if (md === "lobby") {
        m.innerHTML = `<div class="board">
          <div class="side" style="flex:0 0 auto;align-items:center;justify-content:center">
            <div class="qr">${qr()}</div>
            <div class="note">Scanne pour jouer</div>
          </div>
          <div class="side">
            <h2>📱 Scanne et choisis un pseudo</h2>
            <div class="who">${n} joueur${n > 1 ? "s" : ""} dans la salle</div>
            <div class="chips">${pl.map(x => `<b>${esc(x.p)}</b>`).join("")}</div>
            <div class="ctl">
              <button class="go" id="a1">Démarrer</button>
              <button class="go g2" id="a2">Nouvelle séance</button>
            </div>
          </div>
        </div>`;
      }
      else if (md === "vote") {
        m.innerHTML = `<div class="board">
          ${cardHTML(p, false)}
          <div class="side">
            <h2>Profil ${SES.i + 1} / ${P.length} : ${t.n} / ${n} ont voté</h2>
            <div class="bar"><i style="width:${n ? 100 * t.n / n : 0}%;background:var(--pink)"></i></div>
            <div class="chips">${mine(S).filter(x => x.v[SES.i]).map(x => `<b>✓ ${esc(x.p)}</b>`).join("")}</div>
            <div class="qr s">${qr()}</div>
            <div class="ctl"><button class="go" id="a1">Voir les stats maintenant</button></div>
          </div>
        </div>`;
      }
      else if (md === "stats") {
        const mt = t.like.length + t.sup.length,
          tot = Math.max(1, t.n),
          rw = (l, a, c) => `<div class="row"><span>${l}</span><span>${a.length} · ${Math.round(100 * a.length / tot)} %</span></div>
            <div class="bar"><i style="width:${100 * a.length / tot}%;background:${c}"></i></div>
            <div class="nm">${names(a)}</div>`;

        m.innerHTML = `<div class="board">
          ${cardHTML(p, false)}
          <div class="side">
            <h2>💘 ${mt} match${mt > 1 ? "s" : ""} · ✕ ${t.nope.length} râteau${t.nope.length > 1 ? "x" : ""}</h2>
            ${rw("♥ Likes", t.like, "var(--green)")}
            ${rw("★ Super likes", t.sup, "var(--blue)")}
            ${rw("✕ Passées", t.nope, "var(--red)")}
            <div class="ctl"><button class="go" id="a1">${SES.i === P.length - 1 ? "Vote du match parfait" : "Profil suivant"}</button></div>
          </div>
        </div>`;
      }
      else if (md === "match") {
        const ms = mine(M),
          mx = Math.max(1, ...P.map((_, k) => ms.filter(x => x.k === k).length));

        m.innerHTML = `<div class="side" style="flex:1">
          <h2>💘 Ton match parfait : ${ms.length} / ${n} ont choisi</h2>
          ${P.map((q, k) => {
            const a = ms.filter(x => x.k === k);
            return `<div class="row"><span>${q.e} ${q.n}</span><span>${a.length}</span></div>
              <div class="bar"><i style="width:${100 * a.length / mx}%;background:var(--pink)"></i></div>
              <div class="nm">${names(a)}</div>`;
          }).join("")}
          <div class="ctl"><button class="go" id="a1">Terminer</button></div>
        </div>`;
      }
      else {
        const ms = mine(M),
          mx = Math.max(0, ...P.map((_, k) => ms.filter(x => x.k === k).length)),
          w = P
            .map((q, k) => ({ q, a: ms.filter(x => x.k === k) }))
            .filter(x => x.a.length && x.a.length === mx);

        m.innerHTML = `<div class="side" style="flex:1">
          <h2>🏆 Match de la salle : ${w.map(x => x.q.e + " " + x.q.n).join(" + ") || "—"}</h2>
          <div class="who">À toi de les interroger : « Pourquoi celle-là ? »</div>
          ${P.map((q, k) => {
            const a = ms.filter(x => x.k === k);
            return a.length
              ? `<div class="row"><span>${q.e} ${q.n}</span><span>${a.length}</span></div><div class="nm">${names(a)}</div>`
              : "";
          }).join("")}
          <div class="ctl"><button class="go g2" id="a2">Nouvelle séance</button></div>
        </div>`;
      }

      const a1 = $("#a1"),
        a2 = $("#a2");
      if (a1) a1.onclick = adv;
      if (a2) a2.onclick = () => setSes({ sid: sid(), mode: "lobby", i: 0 });
    }

    function adv() {
      const md = SES.mode;
      if (md === "lobby") setSes({ mode: "vote", i: 0 });
      else if (md === "vote") setSes({ mode: "stats" });
      else if (md === "stats") {
        if (SES.i < P.length - 1) setSes({ mode: "vote", i: SES.i + 1 });
        else setSes({ mode: "match" });
      }
      else if (md === "match") setSes({ mode: "end" });
    }

    function startPres() {
      pres = true;
      ph = "pres";
      $("#app").classList.add("wide");

      if (DB) {
        uns.forEach(f => f());
        uns = [
          ["players", x => PL = x],
          ["swipes", x => S = x],
          ["matches", x => M = x]
        ].map(([c, f]) => DB.collection(c).onSnapshot(q => {
          f(q.docs.map(d => d.data()));
          auto();
          render();
        }, () => { }));
      }

      render();
    }

    async function init() {
      try {
        const c = window.claude;
        if (!c) return;

        const [u, d] = await Promise.all([c.use("user"), c.use("db")]);
        if (!u || !d) return;

        UID = await u.id();
        DB = d;

        d.doc("state/session").onSnapshot(s => {
          if (!s.exists) {
            if (pres) {
              SES = { mode: "lobby", i: 0, sid: sid() };
              d.doc("state/session").set(SES).catch(() => { });
            }
          } else {
            const n = s.data();
            if (n.sid !== SES.sid) {
              sw = {};
              mk = null;
            }
            SES = n;
          }
          reg();
          auto();
          render();
        }, () => { });

        if (pres) startPres();
        else render();
      } catch (e) { }
    }

    function hash() {
      if (location.hash === "#presentateur") {
        pres = true;
        ph = "pres";
        $("#app").classList.add("wide");
        if (DB) startPres();
        else render();
      }
    }

    addEventListener("keydown", e => {
      if (pres && (e.key === " " || e.key === "Enter") && document.activeElement.tagName !== "BUTTON") {
        e.preventDefault();
        adv();
      }
      else if (!pres && ph === "intro" && e.key === "Enter") join();
      else if (!pres && SES.mode === "vote" && ph === "play") {
        if (e.key === "ArrowLeft") vote("nope");
        else if (e.key === "ArrowRight") vote("like");
        else if (e.key === "ArrowUp") vote("super");
      }
    });

    addEventListener("hashchange", () => location.reload());

    hash();
    render();
    init();
  </script>
</body>

</html>
