<style>
:root{
  --bg:#f7f8fc;--card:#fff;--ink:#1c2026;--mute:#7c8491;--line:rgba(28,32,38,.09);
  --panel:#ffffff;--pink:#fd267a;--orange:#ff6036;--green:#21d07a;--red:#ff4458;--blue:#2ab6ff;
  --shadow:0 14px 36px rgba(16,22,34,.16);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d12;--card:#181d25;--ink:#f3f5f8;--mute:#9aa3ad;--line:rgba(255,255,255,.09);
    --panel:#151921;--shadow:0 18px 44px rgba(0,0,0,.48);color-scheme:dark
  }
}
:root[data-theme="dark"]{
  --bg:#0b0d12;--card:#181d25;--ink:#f3f5f8;--mute:#9aa3ad;--line:rgba(255,255,255,.09);
  --panel:#151921;--shadow:0 18px 44px rgba(0,0,0,.48);color-scheme:dark
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overflow:hidden;position:relative;
  background-image:radial-gradient(rgba(128,128,128,.12) 1px,transparent 1px);
  background-size:22px 22px
}
body::before,body::after,.aura{
  content:"";position:fixed;border-radius:50%;filter:blur(95px);opacity:.22;z-index:-1;pointer-events:none;
  animation:drift 16s ease-in-out infinite alternate
}
body::before{width:62vmax;height:62vmax;background:var(--pink);top:-26vmax;left:-20vmax}
body::after{width:62vmax;height:62vmax;background:var(--orange);bottom:-30vmax;right:-20vmax;animation-delay:-8s}
.aura{width:42vmax;height:42vmax;background:var(--blue);top:35%;left:30%;opacity:.1;animation-duration:22s}
@keyframes drift{to{transform:translate(7vmax,5vmax) scale(1.14)}}

#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:8px 14px 14px}
#app.wide{max-width:1260px}

header{display:flex;align-items:center;justify-content:center;position:relative;padding:4px 0 12px;min-height:42px}
.logo{
  font-weight:900;font-size:34px;letter-spacing:-1.5px;
  background:linear-gradient(90deg,var(--pink),var(--orange));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  display:flex;align-items:center;gap:6px;user-select:none;
  filter:drop-shadow(0 4px 14px rgba(253,38,122,.35))
}
.logo i{font-style:normal;display:inline-block;-webkit-text-fill-color:initial;animation:beat 1.7s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.24) rotate(-6deg)}30%{transform:scale(1)}}

.top-r{position:absolute;right:2px;display:flex;align-items:center;gap:8px}
.cnt{
  font-size:13px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;
  background:color-mix(in srgb,var(--panel) 84%,transparent);backdrop-filter:blur(12px);
  border:1px solid var(--line);padding:4px 11px;border-radius:99px
}
.cnt:empty{display:none}
.tbtn{
  width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
  background:color-mix(in srgb,var(--panel) 84%,transparent);backdrop-filter:blur(12px);
  color:var(--ink);font-size:14px;display:grid;place-items:center;cursor:pointer;
  transition:transform .2s cubic-bezier(.2,1.5,.4,1)
}
.tbtn:hover{transform:scale(1.12) rotate(12deg)}

#main{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;position:relative}

/* Carte Profil */
.card{
  position:relative;flex:1;min-height:0;border-radius:24px;overflow:hidden;
  box-shadow:0 26px 60px -14px rgba(0,0,0,.48),inset 0 0 0 1.5px rgba(255,255,255,.16);
  touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  animation:pop .5s cubic-bezier(.2,1.3,.4,1) both;will-change:transform
}
.card:active{cursor:grabbing}
@keyframes pop{from{transform:translateY(26px) scale(.93);opacity:0}}
.card::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.26) 50%,transparent 62%);
  transform:translateX(-100%);animation:shine 5.5s ease-in-out infinite;z-index:1;pointer-events:none
}
@keyframes shine{35%,100%{transform:translateX(100%)}}
.card::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 28% 14%,rgba(255,255,255,.32),transparent 56%);pointer-events:none
}

.orb{position:absolute;border-radius:50%;background:rgba(255,255,255,.13);animation:float 6s ease-in-out infinite;pointer-events:none}
.orb.a{width:56%;aspect-ratio:1;top:-11%;right:-16%}
.orb.b{width:36%;aspect-ratio:1;top:30%;left:-11%;animation-delay:-3s}

.seg{position:absolute;top:11px;left:12px;right:12px;display:flex;gap:5px;z-index:2;pointer-events:none}
.seg i{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.32);transition:background .3s}
.seg i.past{background:rgba(255,255,255,.68)}
.seg i.on{background:#fff;box-shadow:0 0 10px rgba(255,255,255,.8)}

.emo{
  position:absolute;inset:0 0 38% 0;display:grid;place-items:center;
  font-size:clamp(100px,26vh,205px);filter:drop-shadow(0 16px 22px rgba(0,0,0,.35));
  animation:float 4s ease-in-out infinite;pointer-events:none
}
.emo::before{
  content:"";position:absolute;left:50%;top:50%;width:68%;aspect-ratio:1;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.48),transparent 70%);z-index:-1
}
@keyframes float{50%{transform:translateY(-13px) rotate(3deg)}}

.dist{
  position:absolute;top:25px;left:14px;z-index:2;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
  backdrop-filter:blur(8px);color:#fff;font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:99px
}

.info{
  position:absolute;left:0;right:0;bottom:0;padding:64px 18px 17px;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.68) 28%,rgba(0,0,0,.94) 70%);pointer-events:none
}
.info h2{margin:0;font-size:clamp(28px,4.8vh,40px);font-weight:700;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.info h2 span{font-weight:400;font-size:.7em;opacity:.92}
.vf{
  width:.62em;height:.62em;border-radius:50%;background:var(--blue);
  display:inline-grid;place-items:center;font-size:.48em;font-weight:800;
  box-shadow:0 2px 10px rgba(42,182,255,.65)
}
.loc{font-size:clamp(12px,1.9vh,15px);opacity:.88;margin:3px 0 9px}
.info p{margin:0 0 11px;font-size:clamp(13px,2.1vh,16px);line-height:1.42;opacity:.94}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags b{
  font-weight:500;font-size:clamp(11px,1.75vh,13.5px);padding:5px 11px;
  border:1px solid rgba(255,255,255,.35);border-radius:99px;
  background:rgba(255,255,255,.14);backdrop-filter:blur(6px)
}

/* Tampons Swipe */
.st{
  position:absolute;top:52px;font-size:34px;font-weight:900;padding:3px 14px;
  border:4px solid;border-radius:12px;opacity:0;pointer-events:none;z-index:3;
  letter-spacing:1px;background:rgba(0,0,0,.22);backdrop-filter:blur(4px)
}
.st.like{left:18px;color:#3be8a0;border-color:#3be8a0;transform:rotate(-14deg)}
.st.nope{right:18px;color:#ff5c72;border-color:#ff5c72;transform:rotate(14deg)}
.st.sup{left:50%;top:40%;transform:translateX(-50%) rotate(-6deg);color:var(--blue);border-color:var(--blue);font-size:28px;white-space:nowrap}

/* Boutons d'action */
.btns{display:flex;justify-content:center;align-items:center;gap:20px;padding:2px 0}
.btns button{
  width:clamp(58px,9.5vh,72px);height:clamp(58px,9.5vh,72px);border-radius:50%;border:2.5px solid;
  background:var(--card);box-shadow:var(--shadow);font-size:clamp(24px,4vh,30px);font-weight:800;
  cursor:pointer;transition:transform .18s cubic-bezier(.2,1.5,.4,1),box-shadow .18s,background .18s,color .18s
}
.btns button:hover{transform:scale(1.12) translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.28)}
.btns button:active{transform:scale(.9)}
.btns .sm{width:clamp(46px,7.2vh,56px);height:clamp(46px,7.2vh,56px);font-size:clamp(20px,3.2vh,25px)}
#bl:hover{background:var(--green);color:#fff!important}
#bn:hover{background:var(--red);color:#fff!important}
#bs:hover{background:var(--blue);color:#fff!important}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* Panneaux Glassmorphism */
.panel,.side{
  background:color-mix(in srgb,var(--panel) 82%,transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--line);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.22)
}
.panel{flex:1;min-height:0;overflow:auto;border-radius:24px;padding:20px;animation:pop .4s both}
.who{color:var(--mute);font-size:14.5px;margin-bottom:10px;line-height:1.4}

.badge-end{
  display:inline-flex;align-items:center;gap:6px;margin:0 auto 14px;
  padding:6px 14px;border-radius:99px;font-size:13px;font-weight:700;
  color:var(--pink);background:rgba(253,38,122,.12);border:1px solid rgba(253,38,122,.28)
}

.go{
  border:0;border-radius:99px;padding:15px 18px;font-size:17px;font-weight:700;color:#fff;
  background:linear-gradient(90deg,var(--pink),var(--orange),var(--pink));
  background-size:200% 100%;animation:sheen 4s linear infinite;letter-spacing:.3px;
  cursor:pointer;width:100%;margin-top:10px;box-shadow:0 10px 24px rgba(253,38,122,.34);
  transition:transform .18s cubic-bezier(.2,1.5,.4,1),box-shadow .18s
}
@keyframes sheen{to{background-position:200% 0}}
.go:hover{transform:translateY(-2px) scale(1.015);box-shadow:0 14px 30px rgba(253,38,122,.44)}
.go:active{transform:scale(.97)}
.go.g2{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:none;animation:none}

.hero{text-align:center;display:flex;flex-direction:column;justify-content:center}
.hero .big{display:grid;place-items:center;margin:0 auto 16px;font-size:0}
.hero .big i{
  width:94px;height:94px;border-radius:50%;
  background:linear-gradient(135deg,var(--pink),var(--orange));
  animation:ring 2.2s infinite;display:grid;place-items:center;
  font-style:normal;font-size:40px;color:#fff;box-shadow:0 10px 26px rgba(253,38,122,.38)
}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(253,38,122,.5)}70%,100%{box-shadow:0 0 0 36px rgba(253,38,122,0)}}
.hero h1{margin:6px 0;font-size:clamp(26px,4.8vh,38px);line-height:1.12;letter-spacing:-.5px}

/* Grille Match Parfait */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:12px 0}
.tile{
  border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:15px 8px;color:#fff;
  font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.22);
  transition:transform .18s cubic-bezier(.2,1.5,.4,1);animation:pop .45s both
}
.tile:hover{transform:scale(1.05) rotate(-1deg)}
.tile:active{transform:scale(.95)}
.tile span{display:block;font-size:40px;margin-bottom:4px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}

/* Écran It's a Match */
.match{
  position:relative;overflow:hidden;text-align:center;color:#fff;border-radius:20px;
  padding:24px 16px;margin-bottom:12px;
  background:linear-gradient(135deg,var(--pink),var(--orange));
  box-shadow:0 14px 34px rgba(253,38,122,.35)
}
.match h1{margin:0 0 6px;font-size:clamp(34px,7vh,50px);font-style:italic;font-weight:900;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.heart{position:absolute;bottom:-30px;animation:up 3.2s linear infinite;opacity:.85;pointer-events:none}
@keyframes up{to{transform:translateY(-330px) rotate(40deg);opacity:0}}
.av{display:flex;justify-content:center;margin:14px 0}
.av span{
  width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center;
  font-size:44px;border:4px solid #fff;box-shadow:var(--shadow);animation:pop .6s both
}
.av span+span{margin-left:-14px;animation-delay:.18s}
.bub{
  display:inline-block;background:#fff;color:#21262e;border-radius:18px;padding:11px 16px;
  font-size:clamp(14px,2.2vh,17px);font-weight:500;max-width:92%;box-shadow:0 6px 18px rgba(0,0,0,.14)
}

input{
  width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font-size:17px;font-weight:600;margin:8px 0;text-align:center;
  transition:border-color .2s,box-shadow .2s
}
input:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 4px rgba(253,38,122,.14)}

/* Tableau Présentateur */
.board{flex:1;min-height:0;display:flex;gap:22px}
.board>.card{flex:0 0 min(36vw,405px);cursor:default}
.side{flex:1;min-width:0;overflow:auto;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:11px;animation:pop .4s both}
.side h2{
  margin:0;font-size:clamp(22px,4.1vh,38px);letter-spacing:-.5px;
  background:linear-gradient(90deg,var(--pink),var(--orange));
  -webkit-background-clip:text;background-clip:text;color:transparent
}
.qr-wrap{
  padding:5px;border-radius:20px;background:linear-gradient(135deg,var(--pink),var(--orange));
  box-shadow:0 14px 32px rgba(253,38,122,.24);animation:pop .55s both
}
.qr{width:min(42vh,280px);background:#fff;border-radius:16px;padding:10px;display:block}
.qr svg{display:block;width:100%;height:auto}
.link-row{display:flex;gap:6px;width:100%;align-items:center}
.lk{font-size:12px;padding:8px 10px;margin:0;flex:1;min-width:0}
.cp{
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;
  padding:8px 11px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;
  transition:transform .15s
}
.cp:hover{transform:scale(1.05)}

.chips{display:flex;flex-wrap:wrap;gap:9px;align-content:flex-start}
.chips b{
  background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(90deg,var(--pink),var(--orange)) border-box;
  border:2px solid transparent;border-radius:99px;padding:7px 15px;
  font-size:clamp(14px,2.3vh,19px);font-weight:600;animation:pop .4s both;
  box-shadow:0 4px 12px rgba(0,0,0,.07);display:inline-flex;align-items:center;gap:6px
}
.bar{height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{
  display:block;height:100%;border-radius:99px;transform-origin:left;
  animation:grow .8s cubic-bezier(.2,1,.3,1) both;box-shadow:0 0 14px rgba(253,38,122,.4)
}
@keyframes grow{from{transform:scaleX(0)}}
.row{display:flex;justify-content:space-between;font-size:clamp(16px,2.9vh,25px);font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.nm{font-size:clamp(13px,2.2vh,18px);color:var(--mute)}
.ctl{display:flex;gap:10px;margin-top:auto;padding-top:8px}
.ctl .go{margin:0}
.note{font-size:12px;color:var(--mute);text-align:center;word-break:break-all;font-weight:600}

/* Podium Final */
.winner-box{
  display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;
  color:#fff;box-shadow:0 12px 28px rgba(0,0,0,.22);animation:pop .5s both
}
.winner-box .we{font-size:46px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.winner-box h3{margin:0;font-size:22px}
.winner-box p{margin:3px 0 0;font-size:13.5px;opacity:.92}

/* Confettis */
.fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.fx i{position:absolute;top:-24px;font-style:normal;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(106vh) rotate(540deg);opacity:0}}

@media (max-width:800px){.board{flex-direction:column}.board>.card{flex:0 0 40vh}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    const el=document.createElement("i");
    el.textContent=list[i%list.length];
    el.style.left=(Math.random()*94+3)+"vw";
    el.style.fontSize=(18+Math.random()*14)+"px";
    el.style.animationDuration=(1.5+Math.random()*1.3)+"s";
    el.style.animationDelay=(Math.random()*.2)+"s";
    fx.appendChild(el);
    setTimeout(()=>el.remove(),3100);
  }
}

/* ---- joueurs = présence de chaque appareil dans la salle ---- */
const pl=()=>peers.filter(p=>p.kind==="viewer"&&!p.presence.role&&p.presence.name&&p.presence.sid===SES.sid);
const vt=(p,i)=>(p.presence.v||[])[i];
const tally=()=>{const s=pl(),k=SES.i,g=t=>s.filter(x=>vt(x,k)===t);return{like:g("like"),sup:g("super"),nope:g("nope"),n:s.filter(x=>vt(x,k)).length}};
const picks=()=>pl().filter(x=>typeof x.presence.k==="number");
const names=a=>a.map(x=>esc(String(x.presence.name).slice(0,20))).join(", ")||"—";
const chipsOf=a=>a.map((x,idx)=>`<b style="animation-delay:${idx*.05}s">🔥 ${esc(String(x.presence.name).slice(0,20))}</b>`).join("");

function qr(){
  try{
    const q=qrcode(0,"M");q.addData(JOIN);q.make();
    const n=q.getModuleCount();let d="";
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+4} ${r+4}h1v1h-1z`;
    return`<svg viewBox="0 0 ${n+8} ${n+8}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QR code pour rejoindre"><path d="${d}" fill="#111"/></svg>`;
  }catch(e){return`<div class="note">${esc(JOIN)}</div>`}
}

function cardHTML(p,live,idx=SES.i){
  const segs=P.map((_,j)=>`<i class="${j===idx?"on":j<idx?"past":""}"></i>`).join("");
  return`<div class="card" style="background:linear-gradient(155deg,${p.g[0]},${p.g[1]})">
    <div class="orb a"></div><div class="orb b"></div>
    <div class="seg">${segs}</div>
    <div class="dist">${ne(p.loc.split(",")[0])}</div>
    <div class="emo">${p.e}</div>
    ${live?`<div class="st like">LIKE</div><div class="st nope">NOPE</div><div class="st sup">SUPER LIKE</div>`:""}
    <div class="info">
      <h2>${p.n}<span>${p.a}</span><b class="vf">✓</b></h2>
      <div class="loc">${ne(p.loc)}</div>
      <p>${ne(p.bio)}</p>
      <div class="tags">${p.t.map(x=>`<b>${ne(x)}</b>`).join("")}</div>
    </div>
  </div>`;
}

function set(h){if(dragging||h===last)return false;last=h;$("#main").innerHTML=h;return true}
const hero=(icon,h,w)=>`<div class="panel hero"><div class="big"><i>${icon}</i></div><h1>${h}</h1><div class="who">${w||""}</div></div>`;

function render(){
  HOST?board():phone();
  $("#cnt").textContent=!HOST&&ph==="play"&&SES.mode==="vote"
    ?(SES.i+1)+" / "+P.length
    :HOST&&room?pl().length+" joueur"+(pl().length>1?"s":""):"";
}

/* ---- déconnexion façon Kahoot en fin de séance ---- */
function disconnectToIntro(msg){
  kickNotice=msg||"🏁 Séance terminée !";
  ph="intro";
  sw={};
  mk=null;
  MY={};
  dragging=false;
  const oldNet=NET;
  NET=null;
  room=null;
  if(oldNet){try{oldNet.close()}catch(_){}}
  last="";
  render();
}

/* ---- téléphone ---- */
function phone(){
  if(ph==="intro"){
    const notice=kickNotice?`<div class="badge-end">${esc(kickNotice)}</div>`:"";
    if(set(`<div class="panel hero">${notice}<div class="big"><i>🔥</i></div><h1>Trouve la data center de ta vie</h1><div class="who">Choisis un pseudo pour rejoindre la séance.</div><input id="pz" maxlength="20" placeholder="Ton pseudo" autocomplete="off" aria-label="Ton pseudo"><button class="go" id="start">Rejoindre</button></div>`)){
      $("#start").onclick=join;
      const inp=$("#pz");if(inp)inp.focus();
    }
    return;
  }
  if(!room){set(hero("📡","Connexion…","Un instant, on te connecte à la salle."));return}
  const md=SES.mode;
  if(md==="lobby"){
    set(hero("🎉","Tu es dans la salle, "+esc(PS),"La séance va commencer. Garde ton téléphone en main."));
  }
  else if(md==="vote"){
    if(sw[SES.i])set(hero("✅","Vote enregistré","Regarde le tableau : on attend les autres."));
    else if(set(cardHTML(P[SES.i],true)+`<div class="btns"><button aria-label="Passer" id="bn" style="color:var(--red);border-color:var(--red)">✕</button><button class="sm" aria-label="Super like" id="bs" style="color:var(--blue);border-color:var(--blue)">★</button><button aria-label="Liker" id="bl" style="color:var(--green);border-color:var(--green)">♥</button></div>`)){
      $("#bn").onclick=()=>vote("nope");
      $("#bl").onclick=()=>vote("like");
      $("#bs").onclick=()=>vote("super");
      bind();
    }
  }
  else if(md==="stats"){
    set(hero("👀","Regarde le tableau","Les résultats de "+P[SES.i].n+" s’affichent."));
  }
  else if(md==="match"){
    if(mk===null){
      if(set(`<div class="panel hero"><h1>Ton match parfait ?</h1><div class="who">Choisis-en une seule.</div><div class="grid">${P.map((p,k)=>`<button class="tile" data-k="${k}" style="background:linear-gradient(155deg,${p.g[0]},${p.g[1]});animation-delay:${k*.06}s"><span>${p.e}</span>${p.n}</button>`).join("")}</div></div>`)){
        document.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{
          mk=+b.dataset.k;
          burst(["💘","💖","✨",P[mk].e]);
          room.presence({k:mk});
          last="";render();
        });
      }
    }else{
      const p=P[mk];
      set(`<div class="panel"><div class="match">${[..."💘❤️💖💕💗"].map((h,i)=>`<span class="heart" style="left:${10+i*20}%;animation-delay:${i*.5}s;font-size:${22+i*4}px">${h}</span>`).join("")}<h1>It’s a match !</h1><div>Toi et ${p.n} vous plaisez mutuellement</div><div class="av"><span>🙂</span><span>${p.e}</span></div><div class="bub">${ne(p.m)}</div></div><div class="who" style="text-align:center">Regarde le tableau pour la suite.</div></div>`);
    }
  }
  else set(hero("⏳","Séance terminée","En attente du lancement de la nouvelle séance…"));
}

function bind(){
  const c=$(".card");if(!c)return;
  let x0=null,y0=0,pid=null;
  const baseShadow="0 26px 60px -14px rgba(0,0,0,.48),inset 0 0 0 1.5px rgba(255,255,255,.16)";

  c.onpointerdown=e=>{
    if(sw[SES.i])return;
    x0=e.clientX;y0=e.clientY;pid=e.pointerId;dragging=true;
    try{c.setPointerCapture(pid)}catch(_){}
    c.style.transition="none";c.style.animation="none";
  };

  c.onpointermove=e=>{
    if(x0===null||e.pointerId!==pid)return;
    const d=e.clientX-x0,u=y0-e.clientY;
    c.style.transform=`translate3d(${d}px,${-Math.max(0,u)/3}px,0) rotate(${d/17}deg)`;
    const l=Math.min(1,Math.max(0,d/105)),n=Math.min(1,Math.max(0,-d/105)),s=Math.abs(d)<70?Math.min(1,Math.max(0,u/120)):0;
    $(".st.like").style.opacity=l;
    $(".st.nope").style.opacity=n;
    $(".st.sup").style.opacity=s;
    if(s>.35)c.style.boxShadow=`0 24px 60px rgba(42,182,255,.55),inset 0 0 0 3px var(--blue)`;
    else if(l>.2)c.style.boxShadow=`0 24px 60px rgba(33,208,122,.5),inset 0 0 0 3px var(--green)`;
    else if(n>.2)c.style.boxShadow=`0 24px 60px rgba(255,68,88,.5),inset 0 0 0 3px var(--red)`;
    else c.style.boxShadow=baseShadow;
  };

  const end=e=>{
    if(x0===null||(e&&e.pointerId!==undefined&&e.pointerId!==pid))return;
    const d=(e?e.clientX:x0)-x0,u=y0-(e?e.clientY:y0);
    try{if(pid!==null)c.releasePointerCapture(pid)}catch(_){}
    x0=null;pid=null;dragging=false;
    if(u>105&&Math.abs(d)<80)vote("super");
    else if(d>95)vote("like");
    else if(d<-95)vote("nope");
    else{
      c.style.transition="transform .28s cubic-bezier(.2,1.5,.4,1),box-shadow .2s";
      c.style.transform="";c.style.boxShadow=baseShadow;
      document.querySelectorAll(".st").forEach(s=>s.style.opacity=0);
    }
  };
  c.onpointerup=end;
  c.onpointercancel=end;
}

function vote(k){
  if(SES.mode!=="vote"||sw[SES.i])return;
  const c=$(".card"),i=SES.i,x=k==="nope"?-1:1;
  sw[i]=k;dragging=false;
  if(k==="super")burst(["⭐","💙","✨"]);
  if(c){
    c.style.animation="none";
    c.style.transition="transform .42s cubic-bezier(.22,1,.36,1),opacity .38s";
    c.style.transform=k==="super"?"translate3d(0,-125%,0) scale(.9)":`translate3d(${x*135}%,20px,0) rotate(${x*25}deg)`;
    c.style.opacity=0;
  }
  if(room)room.presence({v:P.map((_,j)=>sw[j]||null)});
  setTimeout(()=>{last="";render()},380);
}

function join(){
  const z=$("#pz");
  PS=((z&&z.value)||"").trim().slice(0,20)||"Anonyme";
  kickNotice="";
  ph="play";
  MY={name:PS,sid:SES.sid||"",v:[],k:null};
  connectHost();
  last="";render();
}

/* ---- tableau (présentateur) ---- */
function board(){
  const md=SES.mode,p=P[SES.i],n=pl().length,t=tally();let h,after;
  if(!room){set(hero("📡","Connexion…","Un instant, la salle se prépare."));return}
  if(md==="lobby"){
    h=`<div class="board">
      <div class="side" style="flex:0 0 auto;align-items:center;justify-content:center">
        <div class="qr-wrap"><div class="qr">${qr()}</div></div>
        <div class="note">Scanne pour jouer</div>
        <div class="link-row">
          <input class="lk" id="lk" value="${esc(JOIN)}" aria-label="Lien de la séance">
          <button class="cp" id="cp" title="Copier le lien">📋</button>
        </div>
      </div>
      <div class="side">
        <h2>Scanne et choisis un pseudo</h2>
        <div class="who">${n} joueur${n>1?"s":""} dans la salle</div>
        <div class="chips">${chipsOf(pl())}</div>
        <div class="ctl"><button class="go" id="a1">Démarrer</button><button class="go g2" id="a2">Nouvelle séance</button></div>
      </div>
    </div>`;
    after=()=>{
      $("#lk").onchange=e=>{JOIN=e.target.value.trim();last="";render()};
      $("#cp").onclick=async()=>{
        try{await navigator.clipboard.writeText(JOIN);$("#cp").textContent="✅";setTimeout(()=>$("#cp").textContent="📋",1600)}catch(_){}
      };
    };
  }
  else if(md==="vote"){
    h=`<div class="board">${cardHTML(p,false)}<div class="side">
      <h2>Profil ${SES.i+1} / ${P.length}</h2>
      <div class="who" style="font-size:clamp(18px,3vh,28px);font-weight:700;color:var(--ink)">${t.n} / ${n} ont voté</div>
      <div class="bar"><i style="width:${n?100*t.n/n:0}%;background:linear-gradient(90deg,var(--pink),var(--orange))"></i></div>
      <div class="chips">${chipsOf(pl().filter(x=>vt(x,SES.i)))}</div>
      <div class="ctl"><button class="go" id="a1">Voir les stats maintenant</button></div>
    </div></div>`;
  }
  else if(md==="stats"){
    const mt=t.like.length+t.sup.length,tot=Math.max(1,t.n),
      rw=(l,a,c)=>`<div class="row"><span>${l}</span><span>${a.length} · ${Math.round(100*a.length/tot)} %</span></div><div class="bar"><i style="width:${100*a.length/tot}%;background:${c}"></i></div><div class="nm">${names(a)}</div>`;
    h=`<div class="board">${cardHTML(p,false)}<div class="side">
      <h2>${mt} match${mt>1?"s":""} · ✕ ${t.nope.length} râteau${t.nope.length>1?"x":""}</h2>
      ${rw("♥ Likes",t.like,"var(--green)")}
      ${rw("★ Super likes",t.sup,"var(--blue)")}
      ${rw("✕ Passées",t.nope,"var(--red)")}
      <div class="ctl"><button class="go" id="a1">${SES.i===P.length-1?"Vote du match parfait":"Profil suivant"}</button></div>
    </div></div>`;
  }
  else{
    const ms=picks(),cnt=k=>ms.filter(x=>x.presence.k===k),mx=Math.max(0,...P.map((_,k)=>cnt(k).length));
    if(md==="match"){
      h=`<div class="side" style="flex:1">
        <h2>Ton match parfait : ${ms.length} / ${n} ont choisi</h2>
        ${P.map((q,k)=>{const a=cnt(k);return`<div class="row"><span>${q.e} ${q.n}</span><span>${a.length}</span></div><div class="bar"><i style="width:${100*a.length/Math.max(1,mx)}%;background:linear-gradient(90deg,var(--pink),var(--orange))"></i></div><div class="nm">${names(a)}</div>`}).join("")}
        <div class="ctl"><button class="go" id="a1">Terminer</button></div>
      </div>`;
    }else{
      const w=P.map((q,k)=>({q,a:cnt(k)})).filter(x=>x.a.length&&x.a.length===mx);
      h=`<div class="side" style="flex:1">
        <h2>Match de la salle : ${w.map(x=>x.q.e+" "+x.q.n).join(" + ")||"—"}</h2>
        ${w.map(x=>`<div class="winner-box" style="background:linear-gradient(135deg,${x.q.g[0]},${x.q.g[1]})"><div class="we">${x.q.e}</div><div><h3>🏆 ${x.q.n} (${x.q.a})</h3><p>${ne(x.q.m)}</p></div></div>`).join("")}
        <div class="who">À vous d’expliquer le choix de la salle.</div>
        ${P.map((q,k)=>{const a=cnt(k);return a.length?`<div class="row"><span>${q.e} ${q.n}</span><span>${a.length}</span></div><div class="nm">${names(a)}</div>`:""}).join("")}
        <div class="ctl"><button class="go g2" id="a2">Nouvelle séance</button></div>
      </div>`;
    }
  }
  if(set(h)){
    const a1=$("#a1"),a2=$("#a2");
    if(a1)a1.onclick=adv;
    if(a2)a2.onclick=resetSession;
    if(after)after();
  }
}

function kickAll(reason){
  CONNS.forEach(c=>{try{if(c.open)c.send({t:"kick",reason})}catch(_){}});
  setTimeout(()=>{
    CONNS.forEach(c=>{try{c.close()}catch(_){}});
    CONNS=[];
    PRES={};
    sync();
  },250);
}

function resetSession(){
  kickAll("reset");
  setSes({sid:sid(),mode:"lobby",i:0});
}

function setSes(p){
  const prev=SES.mode;
  SES={...SES,...p};
  bc();
  last="";
  render();
  if(SES.mode==="end"&&prev!=="end"){
    burst(["🏆","💘","🔥","🎉","✨"]);
    kickAll("end");
  }
}

function adv(){
  const md=SES.mode;
  if(md==="lobby")setSes({mode:"vote",i:0});
  else if(md==="vote")setSes({mode:"stats"});
  else if(md==="stats"){SES.i<P.length-1?setSes({mode:"vote",i:SES.i+1}):setSes({mode:"match"})}
  else if(md==="match")setSes({mode:"end"});
}
function auto(){if(!HOST||SES.mode!=="vote")return;const n=pl().length;if(n>0&&tally().n>=n)setSes({mode:"stats"})}

/* ---- réseau (PeerJS) ---- */
function bc(){CONNS.forEach(c=>{try{if(c.open)c.send({t:"ses",s:SES})}catch(e){}})}
function sync(){peers=Object.keys(PRES).map(id=>({kind:"viewer",peer:id,presence:PRES[id]}));auto();render()}

function openHost(retry){
  let id="datinder-"+Math.random().toString(36).slice(2,9);
  try{id=localStorage.getItem("dtk")||id;localStorage.setItem("dtk",id)}catch(e){}
  const pr=new Peer(id);
  pr.on("open",()=>{JOIN=location.href.split("#")[0]+"#j="+id;room=true;last="";render()});
  pr.on("connection",c=>{
    CONNS.push(c);
    c.on("open",()=>c.send({t:"ses",s:SES}));
    c.on("data",m=>{
      if(!m||m.t!=="pres"||!m.p)return;
      const q=m.p;
      PRES[c.peer]={
        name:String(q.name||"").slice(0,20),
        sid:String(q.sid||""),
        v:P.map((_,j)=>ok.includes((q.v||[])[j])?q.v[j]:null),
        k:Number.isInteger(q.k)&&q.k>=0&&q.k<P.length?q.k:null
      };
      sync();
    });
    c.on("close",()=>{CONNS=CONNS.filter(x=>x!==c);delete PRES[c.peer];sync()});
  });
  pr.on("disconnected",()=>{if(!pr.destroyed)pr.reconnect()});
  pr.on("error",e=>{if(e.type==="unavailable-id"&&!retry){try{localStorage.removeItem("dtk")}catch(_){}openHost(true)}});
}

function connectHost(){
  if(ph!=="play"||!hostId)return;
  if(NET&&NET.open){if(room)room.presence({});return}
  if(!peerObj){
    peerObj=new Peer();
    peerObj.on("open",()=>{if(ph==="play")connectHost()});
    peerObj.on("disconnected",()=>{if(!peerObj.destroyed)peerObj.reconnect()});
    peerObj.on("error",()=>{});
    return;
  }
  if(peerObj.disconnected){peerObj.reconnect();return}
  if(!peerObj.open)return;

  const c=peerObj.connect(hostId);
  c.on("open",()=>{
    if(ph!=="play"){try{c.close()}catch(_){}return}
    NET=c;
    room={presence:p=>{MY={...MY,...p};try{if(NET&&NET.open&&MY.name)NET.send({t:"pres",p:MY})}catch(e){}}};
    room.presence({});
    last="";render();
  });
  c.on("data",m=>{
    if(!m)return;
    if(m.t==="kick"){
      disconnectToIntro(m.reason==="reset"?"🔄 Nouvelle séance ! Entre ton pseudo.":"🏁 Séance terminée ! Entre un pseudo pour rejouer.");
      return;
    }
    if(m.t==="ses"&&m.s){
      const nw=m.s;
      if(MY.sid&&nw.sid!==MY.sid){
        disconnectToIntro("🔄 Nouvelle séance ! Entre ton pseudo.");
        return;
      }
      SES=nw;
      MY.sid=nw.sid;
      last="";
      if(room&&nw.mode!=="end")room.presence({});
      render();
    }
  });
  c.on("close",()=>{
    if(NET===c){NET=null;room=null}
    if(ph==="play"){
      if(SES.mode==="end")disconnectToIntro("🏁 Séance terminée ! Entre un pseudo pour rejouer.");
      else setTimeout(connectHost,1500);
    }
  });
}

function startPhone(id){
  hostId=id;
  peerObj=new Peer();
  peerObj.on("open",()=>{if(ph==="play")connectHost()});
  peerObj.on("disconnected",()=>{if(!peerObj.destroyed)peerObj.reconnect()});
  peerObj.on("error",()=>{});
}

function start(){
  HOST=!location.hash.startsWith("#j=");
  if(HOST){$("#app").classList.add("wide");SES={mode:"lobby",i:0,sid:sid()};openHost(false)}
  else startPhone(location.hash.slice(3));
  render();
}

addEventListener("keydown",e=>{
  if(HOST&&(e.key===" "||e.key==="Enter")&&!["BUTTON","INPUT"].includes(document.activeElement.tagName)){e.preventDefault();adv()}
  else if(!HOST&&ph==="intro"&&e.key==="Enter")join();
  else if(!HOST&&SES.mode==="vote"&&ph==="play"){
    if(e.key==="ArrowLeft")vote("nope");
    else if(e.key==="ArrowRight")vote("like");
    else if(e.key==="ArrowUp")vote("super");
  }
});
addEventListener("hashchange",()=>location.reload());
start();
