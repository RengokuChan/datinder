<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DATinder – le Tinder des data centers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f9;--card:#ffffff;--ink:#161822;--mute:#687082;--line:rgba(22,24,34,.09);
  --panel:rgba(255,255,255,.92);--panel-solid:#ffffff;--chip:#eef0f6;
  --pink:#fd267a;--orange:#ff6036;--gold:#f0b93d;--green:#21d07a;--red:#ff4458;--blue:#2ab6ff;
  --grad:linear-gradient(135deg,#fd267a 0%,#ff6036 100%);
  --shadow:0 20px 50px rgba(16,19,30,.11);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#090a0f;--card:#141720;--ink:#f5f7fc;--mute:#9199a8;--line:rgba(255,255,255,.09);
    --panel:rgba(19,22,31,.88);--panel-solid:#161923;--chip:#1d212e;
    --shadow:0 24px 60px rgba(0,0,0,.6);color-scheme:dark
  }
}
:root[data-theme="dark"]{
  --bg:#090a0f;--card:#141720;--ink:#f5f7fc;--mute:#9199a8;--line:rgba(255,255,255,.09);
  --panel:rgba(19,22,31,.88);--panel-solid:#161923;--chip:#1d212e;
  --shadow:0 24px 60px rgba(0,0,0,.6);color-scheme:dark
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;position:relative;
  background-image:radial-gradient(rgba(130,140,160,.11) 1px,transparent 1px);
  background-size:24px 24px
}
body::before,body::after{
  content:"";position:fixed;border-radius:50%;filter:blur(120px);opacity:.22;z-index:0;pointer-events:none;
  animation:drift 16s ease-in-out infinite alternate
}
body::before{width:60vmax;height:60vmax;background:var(--pink);top:-25vmax;left:-18vmax}
body::after{width:60vmax;height:60vmax;background:var(--orange);bottom:-28vmax;right:-18vmax;animation-delay:-8s}
@keyframes drift{to{transform:translate(6vmax,5vmax) scale(1.12)}}

#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:10px 14px 14px;position:relative;z-index:1}
#app.wide{max-width:1340px}

header{display:flex;align-items:center;justify-content:center;position:relative;padding:2px 0 12px;min-height:46px}
.logo{
  font-weight:800;font-size:33px;letter-spacing:-1.4px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  display:flex;align-items:center;gap:8px;user-select:none;
  filter:drop-shadow(0 4px 16px rgba(253,38,122,.26))
}
.logo svg{width:30px;height:30px;flex-shrink:0;animation:beat 1.8s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18) rotate(-5deg)}30%{transform:scale(1)}}

.top-r{position:absolute;right:2px;display:flex;align-items:center;gap:8px}
.cnt{
  font-size:13px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;
  background:var(--panel);backdrop-filter:blur(14px);
  border:1px solid var(--line);padding:6px 13px;border-radius:99px;
  display:inline-flex;align-items:center;gap:7px
}
.cnt:empty{display:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);display:inline-block;flex-shrink:0}
.tbtn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel);backdrop-filter:blur(14px);
  color:var(--ink);font-size:15px;display:grid;place-items:center;cursor:pointer;
  transition:transform .2s cubic-bezier(.2,1.5,.4,1)
}
.tbtn:hover{transform:scale(1.1) rotate(12deg)}

#main{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;position:relative}

/* Carte Profil Tinder */
.card{
  position:relative;flex:1;min-height:0;border-radius:26px;overflow:hidden;
  box-shadow:0 28px 64px -14px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.18);
  touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  animation:pop .48s cubic-bezier(.2,1.3,.4,1) both;will-change:transform
}
.card:active{cursor:grabbing}
@keyframes pop{from{transform:translateY(24px) scale(.94);opacity:0}}
.card::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.24) 50%,transparent 62%);
  transform:translateX(-100%);animation:shine 5.5s ease-in-out infinite;z-index:1;pointer-events:none
}
@keyframes shine{35%,100%{transform:translateX(100%)}}
.card::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 28% 14%,rgba(255,255,255,.28),transparent 56%);pointer-events:none
}

.orb{position:absolute;border-radius:50%;background:rgba(255,255,255,.12);animation:float 6s ease-in-out infinite;pointer-events:none}
.orb.a{width:56%;aspect-ratio:1;top:-11%;right:-16%}
.orb.b{width:36%;aspect-ratio:1;top:30%;left:-11%;animation-delay:-3s}

.seg{position:absolute;top:12px;left:13px;right:13px;display:flex;gap:5px;z-index:2;pointer-events:none}
.seg i{flex:1;height:3.5px;border-radius:99px;background:rgba(255,255,255,.32);transition:background .3s}
.seg i.past{background:rgba(255,255,255,.7)}
.seg i.on{background:#fff;box-shadow:0 0 10px rgba(255,255,255,.85)}

.emo{
  position:absolute;inset:0 0 38% 0;display:grid;place-items:center;
  font-size:clamp(100px,26vh,205px);filter:drop-shadow(0 16px 22px rgba(0,0,0,.35));
  animation:float 4s ease-in-out infinite;pointer-events:none
}
.emo::before{
  content:"";position:absolute;left:50%;top:50%;width:66%;aspect-ratio:1;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.46),transparent 70%);z-index:-1
}
@keyframes float{50%{transform:translateY(-12px) rotate(3deg)}}

.dist{
  position:absolute;top:25px;left:14px;z-index:2;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.28);
  backdrop-filter:blur(10px);color:#fff;font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:99px
}

.info{
  position:absolute;left:0;right:0;bottom:0;padding:64px 18px 18px;color:#fff;
  background:linear-gradient(transparent,rgba(8,10,15,.74) 28%,rgba(8,10,15,.96) 72%);pointer-events:none
}
.info h2{margin:0;font-size:clamp(28px,4.8vh,40px);font-weight:800;letter-spacing:-.6px;display:flex;align-items:center;gap:8px}
.info h2 span{font-weight:500;font-size:.68em;opacity:.9}
.vf{
  width:.62em;height:.62em;border-radius:50%;background:var(--blue);
  display:inline-grid;place-items:center;font-size:.48em;font-weight:800;
  box-shadow:0 2px 10px rgba(42,182,255,.65)
}
.loc{font-size:clamp(12px,1.9vh,15px);opacity:.88;margin:3px 0 9px;font-weight:500}
.info p{margin:0 0 11px;font-size:clamp(13px,2.1vh,15.5px);line-height:1.42;opacity:.94}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags b{
  font-weight:600;font-size:clamp(11px,1.75vh,13px);padding:5px 11px;
  border:1px solid rgba(255,255,255,.3);border-radius:99px;
  background:rgba(255,255,255,.14);backdrop-filter:blur(6px)
}

/* Tampons Swipe Tinder */
.st{
  position:absolute;top:52px;font-size:34px;font-weight:800;padding:3px 14px;
  border:4px solid;border-radius:12px;opacity:0;pointer-events:none;z-index:3;
  letter-spacing:1.2px;background:rgba(0,0,0,.22);backdrop-filter:blur(4px)
}
.st.like{left:18px;color:#3be8a0;border-color:#3be8a0;transform:rotate(-14deg)}
.st.nope{right:18px;color:#ff5c72;border-color:#ff5c72;transform:rotate(14deg)}
.st.sup{left:50%;top:40%;transform:translateX(-50%) rotate(-6deg);color:var(--blue);border-color:var(--blue);font-size:28px;white-space:nowrap}

/* Boutons d'action circulaires Tinder avec icônes SVG */
.btns{display:flex;justify-content:center;align-items:center;gap:20px;padding:2px 0}
.btns button{
  width:clamp(60px,9.5vh,74px);height:clamp(60px,9.5vh,74px);border-radius:50%;border:2px solid;
  background:var(--panel-solid);box-shadow:0 12px 28px rgba(0,0,0,.24);
  display:grid;place-items:center;cursor:pointer;
  transition:transform .18s cubic-bezier(.2,1.5,.4,1),box-shadow .18s,background .18s,color .18s
}
.btns button svg{width:44%;height:44%}
.btns button:hover{transform:scale(1.12) translateY(-3px);box-shadow:0 16px 34px rgba(0,0,0,.34)}
.btns button:active{transform:scale(.9)}
.btns .sm{width:clamp(48px,7.4vh,58px);height:clamp(48px,7.4vh,58px)}
#bn{color:var(--red);border-color:rgba(255,68,88,.35)}
#bs{color:var(--blue);border-color:rgba(42,182,255,.35)}
#bl{color:var(--green);border-color:rgba(33,208,122,.35)}
#bl:hover{background:var(--green);border-color:var(--green);color:#fff!important}
#bn:hover{background:var(--red);border-color:var(--red);color:#fff!important}
#bs:hover{background:var(--blue);border-color:var(--blue);color:#fff!important}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* Surfaces vitrées Tinder */
.panel,.side,.box{
  background:var(--panel);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid var(--line);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.14)
}
.panel{flex:1;min-height:0;overflow:auto;border-radius:26px;padding:22px;animation:pop .4s both}
.who{color:var(--mute);font-size:14.5px;margin-bottom:10px;line-height:1.45}

.badge-end{
  display:inline-flex;align-items:center;gap:6px;margin:0 auto 14px;
  padding:6px 14px;border-radius:99px;font-size:13px;font-weight:700;
  color:var(--pink);background:rgba(253,38,122,.12);border:1px solid rgba(253,38,122,.28);
  animation:pop .35s both
}

.go{
  border:0;border-radius:99px;padding:15px 24px;font-size:16.5px;font-weight:700;color:#fff;
  background:linear-gradient(90deg,var(--pink),var(--orange),var(--pink));
  background-size:200% 100%;animation:sheen 4s linear infinite;letter-spacing:.2px;
  cursor:pointer;width:100%;margin-top:10px;box-shadow:0 10px 26px rgba(253,38,122,.34);
  transition:transform .18s cubic-bezier(.2,1.5,.4,1),box-shadow .18s
}
@keyframes sheen{to{background-position:200% 0}}
.go:hover{transform:translateY(-2px) scale(1.015);box-shadow:0 14px 32px rgba(253,38,122,.46)}
.go:active{transform:scale(.97)}
.go.g2{
  background:var(--chip);color:var(--ink);border:1px solid var(--line);
  box-shadow:none;animation:none
}
.go.g2:hover{background:var(--panel-solid)}

.hero{text-align:center;display:flex;flex-direction:column;justify-content:center}
.hero .big{display:grid;place-items:center;margin:0 auto 16px;font-size:0}
.hero .big i{
  width:90px;height:90px;border-radius:50%;
  background:var(--grad);
  animation:ring 2.2s infinite;display:grid;place-items:center;
  font-style:normal;font-size:38px;color:#fff;box-shadow:0 10px 26px rgba(253,38,122,.38)
}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(253,38,122,.48)}70%,100%{box-shadow:0 0 0 34px rgba(253,38,122,0)}}
.hero h1{margin:6px 0;font-size:clamp(25px,4.6vh,36px);font-weight:800;line-height:1.14;letter-spacing:-.6px}

.phone-tips{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;
  padding-top:16px;border-top:1px solid var(--line)
}
.phone-tips div{
  background:var(--chip);border-radius:14px;padding:9px 6px;font-size:11.5px;font-weight:700;color:var(--mute)
}
.phone-tips b{display:block;font-size:15px;margin-bottom:2px}

/* Grille Match Parfait */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:12px 0}
.tile{
  border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:15px 8px;color:#fff;
  font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.22);
  transition:transform .18s cubic-bezier(.2,1.5,.4,1);animation:pop .45s both
}
.tile:hover{transform:scale(1.05) rotate(-1deg)}
.tile:active{transform:scale(.95)}
.tile span{display:block;font-size:38px;margin-bottom:4px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}

/* Écran It's a Match */
.match{
  position:relative;overflow:hidden;text-align:center;color:#fff;border-radius:22px;
  padding:24px 16px;margin-bottom:12px;
  background:var(--grad);
  box-shadow:0 14px 34px rgba(253,38,122,.35)
}
.match h1{margin:0 0 6px;font-size:clamp(34px,7vh,50px);font-style:italic;font-weight:800;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.heart{position:absolute;bottom:-30px;animation:up 3.2s linear infinite;opacity:.85;pointer-events:none}
@keyframes up{to{transform:translateY(-330px) rotate(40deg);opacity:0}}
.av{display:flex;justify-content:center;margin:14px 0}
.av span{
  width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center;
  font-size:44px;border:4px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.22);animation:pop .6s both
}
.av span+span{margin-left:-14px;animation-delay:.18s}
.bub{
  display:inline-block;background:#fff;color:#191c24;border-radius:18px;padding:11px 16px;
  font-size:clamp(14px,2.2vh,16.5px);font-weight:600;max-width:92%;box-shadow:0 6px 18px rgba(0,0,0,.14)
}

input{
  width:100%;padding:14px 16px;border-radius:99px;border:1.5px solid var(--line);
  background:var(--chip);color:var(--ink);font-size:17px;font-weight:700;margin:8px 0;text-align:center;
  transition:border-color .2s,box-shadow .2s,background .2s
}
input:focus{outline:none;background:var(--panel-solid);border-color:var(--pink);box-shadow:0 0 0 4px rgba(253,38,122,.16)}

/* =========================================================
   LOBBY PRÉSENTATEUR : ZERO VIDE, ZERO SPOILER, 100% TINDER
   ========================================================= */
.lobby-wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(310px,375px) 1fr;gap:18px}
.qr-col{
  border-radius:26px;padding:22px;display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;gap:14px;animation:pop .4s both
}
.live-pill{
  display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:99px;
  font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
  color:var(--pink);background:rgba(253,38,122,.12);border:1px solid rgba(253,38,122,.28)
}
.qr-wrap{
  padding:7px;border-radius:24px;background:var(--grad);
  box-shadow:0 18px 40px rgba(253,38,122,.3);width:min(100%,275px)
}
.qr{width:100%;background:#fff;border-radius:18px;padding:13px;display:block}
.qr svg{display:block;width:100%;height:auto}
.link-row{display:flex;gap:6px;width:100%;align-items:center}
.lk{font-size:12px;padding:10px 12px;margin:0;flex:1;min-width:0;font-weight:600}
.cp{
  border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:99px;
  padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;
  transition:transform .15s,background .15s
}
.cp:hover{transform:scale(1.06);background:var(--panel-solid)}
.steps{
  width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  padding-top:10px;border-top:1px solid var(--line);text-align:center
}
.steps div{
  background:var(--chip);border-radius:14px;padding:9px 4px;font-size:12px;font-weight:700;color:var(--mute)
}
.steps span{display:block;font-size:18px;margin-bottom:3px}

.lobby-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.players-box{
  flex:1;min-height:0;border-radius:26px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;
  overflow:auto;animation:pop .44s both
}
.l-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.l-head h2{
  margin:0;font-size:clamp(22px,3.4vh,32px);font-weight:800;letter-spacing:-.5px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent
}
.l-sub{color:var(--mute);font-size:14px;margin:3px 0 0;font-weight:500}
.count-badge{
  padding:9px 18px;border-radius:99px;font-size:14.5px;font-weight:800;color:#fff;
  background:var(--grad);box-shadow:0 8px 22px rgba(253,38,122,.3);
  display:inline-flex;align-items:center;gap:8px
}

/* Radar Tinder riche avec badges flottants quand la salle attend des joueurs */
.radar-zone{
  flex:1;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;position:relative;padding:12px;overflow:hidden
}
.radar{
  position:relative;width:136px;height:136px;display:grid;place-items:center;margin-bottom:16px
}
.radar span{
  position:absolute;inset:0;border-radius:50%;border:2px solid rgba(253,38,122,.4);
  background:radial-gradient(circle,rgba(253,38,122,.12),transparent 70%);
  animation:sonar 3s cubic-bezier(.15,.7,.35,1) infinite
}
.radar span:nth-child(2){animation-delay:1s}
.radar span:nth-child(3){animation-delay:2s}
@keyframes sonar{
  0%{transform:scale(.6);opacity:.95}
  100%{transform:scale(2.35);opacity:0}
}
.radar b{
  position:relative;z-index:2;width:74px;height:74px;border-radius:50%;background:var(--grad);
  display:grid;place-items:center;color:#fff;
  box-shadow:0 12px 28px rgba(253,38,122,.45)
}
.radar b svg{width:34px;height:34px}
.orbit-tag{
  position:absolute;z-index:3;width:34px;height:34px;border-radius:50%;
  background:var(--panel-solid);border:1px solid var(--line);
  box-shadow:0 6px 16px rgba(0,0,0,.22);display:grid;place-items:center;
  font-size:15px;font-weight:800;animation:float 3.5s ease-in-out infinite
}
.orbit-tag.t1{top:6px;right:8px;color:var(--green)}
.orbit-tag.t2{bottom:10px;left:4px;color:var(--blue);animation-delay:-1.2s}
.orbit-tag.t3{top:14px;left:10px;color:var(--red);animation-delay:-2.4s}
.radar-zone p{margin:0;font-size:16.5px;font-weight:800;color:var(--ink)}
.radar-zone small{color:var(--mute);font-size:13.5px;margin-top:4px}

/* Grille de joueurs connectés style Tinder Match */
.p-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:11px;
  align-content:start;padding:2px 0
}
.p-card{
  display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:18px;
  background:var(--chip);border:1px solid var(--line);
  animation:pop .38s cubic-bezier(.2,1.5,.4,1) both
}
.p-av{
  width:38px;height:38px;border-radius:50%;color:#fff;
  font-weight:800;font-size:15px;display:grid;place-items:center;flex-shrink:0;
  box-shadow:0 4px 12px rgba(0,0,0,.22);position:relative
}
.p-av::after{
  content:"";position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;
  background:var(--green);border:2px solid var(--panel-solid)
}
.p-meta{min-width:0;flex:1}
.p-nm{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-st{font-size:11.5px;color:var(--mute);font-weight:600}

/* Bandeau Guide des Gestes Tinder (remplit le bas sans rien spoiler) */
.guide-bar{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px
}
.g-item{
  border-radius:20px;padding:13px 15px;display:flex;align-items:center;gap:12px;
  animation:pop .48s both
}
.g-ic{
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  font-size:18px;font-weight:900;flex-shrink:0
}
.g-ic.r{background:rgba(255,68,88,.14);color:var(--red);border:1.5px solid rgba(255,68,88,.3)}
.g-ic.b{background:rgba(42,182,255,.14);color:var(--blue);border:1.5px solid rgba(42,182,255,.3)}
.g-ic.g{background:rgba(33,208,122,.14);color:var(--green);border:1.5px solid rgba(33,208,122,.3)}
.g-txt b{display:block;font-size:13.5px;font-weight:800;color:var(--ink)}

}
.winner-box .we{font-size:50px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.28))}
.winner-box h3{margin:0;font-size:22px;font-weight:800}

.fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}

    return`<svg viewBox="0 0 ${n+8} ${n+8}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QR code pour rejoindre"><path d="${d}" fill="#111"/></svg>`;

}

  }

function bind(){
  const c=$(".card");if(!c)return;
  let x0=null,y0=0,pid=null;
  const baseShadow="0 28px 64px -14px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.18)";

  c.onpointerdown=e=>{
    if(sw[SES.i])return;
    x0=e.clientX;y0=e.clientY;pid=e.pointerId;dragging=true;
    try{c.setPointerCapture(pid)}catch(_){}
    c.style.transition="none";c.style.animation="none";
  };

  c.onpointermove=e=>{
    if(x0===null||e.pointerId!==pid)return;
    const d=e.clientX-x0,u=y0-e.clientY;
    c.style.transform=`translate3d(${d}px,${-Math.max(0,u)/3}px,0) rotate(${d/17}deg)`;
    const l=Math.min(1,Math.max(0,d/105)),n=Math.min(1,Math.max(0,-d/105)),s=Math.abs(d)<70?Math.min(1,Math.max(0,u/120)):0;
    $(".st.like").style.opacity=l;
    $(".st.nope").style.opacity=n;
    $(".st.sup").style.opacity=s;
    if(s>.35)c.style.boxShadow=`0 24px 60px rgba(42,182,255,.55),inset 0 0 0 3px var(--blue)`;
    else if(l>.2)c.style.boxShadow=`0 24px 60px rgba(33,208,122,.5),inset 0 0 0 3px var(--green)`;
    else if(n>.2)c.style.boxShadow=`0 24px 60px rgba(255,68,88,.5),inset 0 0 0 3px var(--red)`;
    else c.style.boxShadow=baseShadow;
  };

  const end=e=>{
    if(x0===null||(e&&e.pointerId!==undefined&&e.pointerId!==pid))return;
    const d=(e?e.clientX:x0)-x0,u=y0-(e?e.clientY:y0);
    try{if(pid!==null)c.releasePointerCapture(pid)}catch(_){}
    x0=null;pid=null;dragging=false;
    if(u>105&&Math.abs(d)<80)vote("super");
    else if(d>95)vote("like");
    else if(d<-95)vote("nope");
    else{
      c.style.transition="transform .28s cubic-bezier(.2,1.5,.4,1),box-shadow .2s";
      c.style.transform="";c.style.boxShadow=baseShadow;
      document.querySelectorAll(".st").forEach(s=>s.style.opacity=0);
    }
  };
  c.onpointerup=end;
  c.onpointercancel=end;
}

function vote(k){
  if(SES.mode!=="vote"||sw[SES.i])return;
  const c=$(".card"),i=SES.i,x=k==="nope"?-1:1;
  sw[i]=k;dragging=false;
  if(k==="super")burst(["⭐","💙","✨"]);
  if(c){
    c.style.animation="none";
    c.style.transition="transform .42s cubic-bezier(.22,1,.36,1),opacity .38s";
    c.style.transform=k==="super"?"translate3d(0,-125%,0) scale(.9)":`translate3d(${x*135}%,20px,0) rotate(${x*25}deg)`;
    c.style.opacity=0;
  }
  if(room)room.presence({v:P.map((_,j)=>sw[j]||null)});
  setTimeout(()=>{last="";render()},380);
}

function join(){

        <div class="live-pill"><span class="dot"></span>Session en direct</div>
        <div class="qr-wrap"><div class="qr">${qr()}</div></div>
        <div class="link-row">
          <input class="lk" id="lk" value="${esc(JOIN)}" aria-label="Lien de la séance">
          <button class="cp" id="cp" title="Copier le lien">📋 Copier</button>
        </div>
        <div class="steps">
          <div><span>📱</span>1. Scanne</div>
          <div><span>✍️</span>2. Pseudo</div>
          <div><span>💘</span>3. Swipe</div>
        </div>
      </div>

      <div class="lobby-main">
        <div class="box players-box">
          <div class="l-head">
            <div>
              <h2>Scanne et choisis un pseudo</h2>
              <div class="l-sub">Les participants connectés s’affichent en direct ci-dessous</div>
            </div>
            <div class="count-badge">🔥 ${n} connecté${n>1?"s":""}</div>
          </div>
          ${centerContent}
        </div>

        <div class="guide-bar">
          <div class="box g-item">
            <div class="g-ic r">✕</div>
            <div class="g-txt"><b>Glisse à gauche · NOPE</b><span>Pas pour ton infra</span></div>
          </div>
          <div class="box g-item">
            <div class="g-ic b">★</div>
            <div class="g-txt"><b>Glisse en haut · SUPER LIKE</b><span>Gros coup de cœur</span></div>
          </div>
          <div class="box g-item">
            <div class="g-ic g">♥</div>
            <div class="g-txt"><b>Glisse à droite · LIKE</b><span>Ça match à 100 %</span></div>
          </div>
        </div>

        <div class="ctl">
          <button class="go" id="a1">Démarrer le swipe</button>
          <button class="go g2" id="a2">Nouvelle séance</button>
        </div>
      </div>
    </div>`;
    after=()=>{
      $("#lk").onchange=e=>{JOIN=e.target.value.trim();last="";render()};
      $("#cp").onclick=async()=>{
        try{await navigator.clipboard.writeText(JOIN);$("#cp").textContent="✅ Copié";setTimeout(()=>$("#cp").textContent="📋 Copier",1600)}catch(_){}
      };
    };
  }
  else if(md==="vote"){
    h=`<div class="board">${cardHTML(p,false)}<div class="side">
      <h2>Profil ${SES.i+1} / ${P.length}</h2>
      <div class="who" style="font-size:clamp(18px,3vh,28px);font-weight:800;color:var(--ink)">${t.n} / ${n} ont swipé</div>
      <div class="bar"><i style="width:${n?100*t.n/n:0}%;background:var(--grad)"></i></div>
      <div class="chips">${chipsOf(players.filter(x=>vt(x,SES.i)))}</div>
      <div class="ctl"><button class="go" id="a1">Voir les matchs maintenant</button></div>
    </div></div>`;
  }
  else if(md==="stats"){
    const mt=t.like.length+t.sup.length,tot=Math.max(1,t.n),
      rw=(l,a,c)=>`<div class="row"><span>${l}</span><span>${a.length} · ${Math.round(100*a.length/tot)} %</span></div><div class="bar"><i style="width:${100*a.length/tot}%;background:${c}"></i></div><div class="nm">${names(a)}</div>`;
    h=`<div class="board">${cardHTML(p,false)}<div class="side">
      <h2>${mt} match${mt>1?"s":""} · ✕ ${t.nope.length} râteau${t.nope.length>1?"x":""}</h2>
      ${rw("♥ Likes",t.like,"var(--green)")}
      ${rw("★ Super likes",t.sup,"var(--blue)")}
      ${rw("✕ Passées",t.nope,"var(--red)")}
      <div class="ctl"><button class="go" id="a1">${SES.i===P.length-1?"Vote du match parfait":"Profil suivant"}</button></div>
    </div></div>`;
  }
  else{
    const ms=picks(),cnt=k=>ms.filter(x=>x.presence.k===k),mx=Math.max(0,...P.map((_,k)=>cnt(k).length));
    if(md==="match"){
      h=`<div class="side" style="flex:1">
        <h2>Ton match parfait : ${ms.length} / ${n} ont choisi</h2>
        ${P.map((q,k)=>{const a=cnt(k);return`<div class="row"><span>${q.e} ${q.n}</span><span>${a.length}</span></div><div class="bar"><i style="width:${100*a.length/Math.max(1,mx)}%;background:var(--grad)"></i></div><div class="nm">${names(a)}</div>`}).join("")}
        <div class="ctl"><button class="go" id="a1">Terminer</button></div>
      </div>`;
    }else{
      const w=P.map((q,k)=>({q,a:cnt(k)})).filter(x=>x.a.length&&x.a.length===mx);
      h=`<div class="side" style="flex:1">
        <h2>Match de la salle : ${w.map(x=>x.q.e+" "+x.q.n).join(" + ")||"—"}</h2>
        ${w.map(x=>`<div class="winner-box" style="background:linear-gradient(135deg,${x.q.g[0]},${x.q.g[1]})"><div class="we">${x.q.e}</div><div><h3>🏆 ${x.q.n} (${x.q.a})</h3><p>${ne(x.q.m)}</p></div></div>`).join("")}
        <div class="who">Tous les joueurs ont été déconnectés de la salle.</div>
        ${P.map((q,k)=>{const a=cnt(k);return a.length?`<div class="row"><span>${q.e} ${q.n}</span><span>${a.length}</span></div><div class="nm">${names(a)}</div>`:""}).join("")}
        <div class="ctl"><button class="go" id="a2">Nouvelle séance</button></div>
      </div>`;
    }
  }
  if(set(h)){
    const a1=$("#a1"),a2=$("#a2");
    if(a1)a1.onclick=adv;
    if(a2)a2.onclick=resetSession;
    if(after)after();
  }
}

function kickAll(reason){
  const list=[...CONNS];
  list.forEach(c=>{try{if(c.open)c.send({t:"kick",reason})}catch(_){}});
  setTimeout(()=>{
    list.forEach(c=>{try{c.close()}catch(_){}});
    CONNS=[];
    PRES={};
    sync();
  },250);
}

function resetSession(){
  kickAll("reset");
  setSes({sid:sid(),mode:"lobby",i:0});
}

function setSes(p){
  const prev=SES.mode;
  SES={...SES,...p};
  bc();
  last="";
  render();
  if(SES.mode==="end"&&prev!=="end"){
    burst(["🏆","💘","🔥","🎉","✨"]);
    kickAll("end");
  }
}

function adv(){
  const md=SES.mode;
  if(md==="lobby")setSes({mode:"vote",i:0});
  else if(md==="vote")setSes({mode:"stats"});
  else if(md==="stats"){SES.i<P.length-1?setSes({mode:"vote",i:SES.i+1}):setSes({mode:"match"})}
  else if(md==="match")setSes({mode:"end"});
}
function auto(){if(!HOST||SES.mode!=="vote")return;const n=pl().length;if(n>0&&tally().n>=n)setSes({mode:"stats"})}

/* ---- réseau (PeerJS) ---- */
function bc(){CONNS.forEach(c=>{try{if(c.open)c.send({t:"ses",s:SES})}catch(e){}})}
function sync(){peers=Object.keys(PRES).map(id=>({kind:"viewer",peer:id,presence:PRES[id]}));auto();render()}

function openHost(retry){
  let id="datinder-"+Math.random().toString(36).slice(2,9);
  try{id=localStorage.getItem("dtk")||id;localStorage.setItem("dtk",id)}catch(e){}
  const pr=new Peer(id);
  pr.on("open",()=>{JOIN=location.href.split("#")[0]+"#j="+id;room=true;last="";render()});
  pr.on("connection",c=>{
    if(SES.mode==="end"){
      c.on("open",()=>{try{c.send({t:"ended"})}catch(_){}setTimeout(()=>{try{c.close()}catch(_){}},150)});
      return;
    }
    CONNS.push(c);
    c.on("open",()=>c.send({t:"ses",s:SES}));
    c.on("data",m=>{
      if(!m||m.t!=="pres"||!m.p||SES.mode==="end")return;
      const q=m.p;
      PRES[c.peer]={
        name:String(q.name||"").slice(0,20),
        sid:String(q.sid||""),
        v:P.map((_,j)=>ok.includes((q.v||[])[j])?q.v[j]:null),
        k:Number.isInteger(q.k)&&q.k>=0&&q.k<P.length?q.k:null
      };
      sync();
    });
    c.on("close",()=>{CONNS=CONNS.filter(x=>x!==c);delete PRES[c.peer];sync()});
  });
  pr.on("disconnected",()=>{if(!pr.destroyed)pr.reconnect()});
  pr.on("error",e=>{if(e.type==="unavailable-id"&&!retry){try{localStorage.removeItem("dtk")}catch(_){}openHost(true)}});
}

function connectHost(){
  if(ph!=="play"||!hostId)return;
  const gen=++connGen;
  if(NET){try{NET.close()}catch(_){}NET=null}
  if(peerObj){try{peerObj.destroy()}catch(_){}peerObj=null}

  const pr=new Peer();
  peerObj=pr;

  pr.on("open",()=>{
    if(gen!==connGen||ph!=="play")return;
    const c=pr.connect(hostId);
    c.on("open",()=>{
      if(gen!==connGen||ph!=="play"){try{c.close()}catch(_){}return}
      NET=c;
      room={presence:p=>{MY={...MY,...p};try{if(NET&&NET.open&&MY.name)NET.send({t:"pres",p:MY})}catch(e){}}};
      room.presence({});
      last="";render();
    });
    c.on("data",m=>{
      if(gen!==connGen||!m)return;
      if(m.t==="ended"){
        disconnectToIntro("⏳ Séance terminée — Attends la nouvelle séance !");
        return;
      }
      if(m.t==="kick"){
        disconnectToIntro(m.reason==="reset"?"🔄 Nouvelle séance ! Entre ton pseudo.":"🏁 Séance terminée — Déconnecté de la salle");
        return;
      }
      if(m.t==="ses"&&m.s){
        const nw=m.s;
        if(nw.mode==="end"){
          disconnectToIntro("🏁 Séance terminée — Déconnecté de la salle");
          return;
        }
        if(MY.sid&&nw.sid!==MY.sid){
          disconnectToIntro("🔄 Nouvelle séance ! Entre ton pseudo.");
          return;
        }
        SES=nw;
        MY.sid=nw.sid;
        last="";
        if(room)room.presence({});
        render();
      }
    });
    c.on("close",()=>{
      if(gen!==connGen)return;
      NET=null;room=null;
      if(ph==="play"){
        disconnectToIntro("🔌 Déconnecté de la salle");
      }
    });
  });

  pr.on("error",()=>{
    if(gen!==connGen)return;
    if(ph==="play"){
      setTimeout(()=>{if(gen===connGen&&ph==="play"&&!NET)connectHost()},1500);
    }
  });
}

function startPhone(id){
  hostId=id;
}

function start(){
  HOST=!location.hash.startsWith("#j=");
  if(HOST){$("#app").classList.add("wide");SES={mode:"lobby",i:0,sid:sid()};openHost(false)}
  else startPhone(location.hash.slice(3));
  render();
}

addEventListener("keydown",e=>{
  if(HOST&&(e.key===" "||e.key==="Enter")&&!["BUTTON","INPUT"].includes(document.activeElement.tagName)){e.preventDefault();adv()}
  else if(!HOST&&ph==="intro"&&e.key==="Enter")join();
  else if(!HOST&&SES.mode==="vote"&&ph==="play"){
    if(e.key==="ArrowLeft")vote("nope");
    else if(e.key==="ArrowRight")vote("like");
    else if(e.key==="ArrowUp")vote("super");
  }
});
addEventListener("hashchange",()=>location.reload());
start();
</script></body></html>
